<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مبخوت بن عبدالله | Mabkhout Bin Abdullah</title>

  <meta name="description" content="الموقع الشخصي لمبخوت بن عبدالله">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #061426;
      --navy-light: #0b1d31;
      --gold: #d4af37;
      --gold-light: #f0d878;
      --white: #f7f5ef;
      --muted: #aeb4bc;
      --line: rgba(212, 175, 55, 0.32);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(212, 175, 55, 0.08),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #030b16 0%,
          #061426 45%,
          #020811 100%
        );
      color: var(--white);
      font-family: "Cairo", sans-serif;
      overflow-x: hidden;
    }

    /* شبكة خلفية فاخرة */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );
      background-size: 72px 72px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
      );
    }

    /* توهج ذهبي */
    .gold-glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.08);
      filter: blur(90px);
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* الهيدر */
    header {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(212,175,55,0.14);
      background: rgba(3, 11, 22, 0.82);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 10;
    }

    .brand {
      font-family: "Inter", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--gold-light);
    }

    .header-title {
      font-size: 15px;
      color: #c7ccd2;
      letter-spacing: 1px;
    }

    /* المحتوى الرئيسي */
    main {
      width: min(1120px, 92%);
      margin: auto;
      padding: 70px 0 90px;
    }

    .hero {
      min-height: calc(100vh - 176px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* الزاوية */
    .corner {
      position: absolute;
      width: 80px;
      height: 80px;
      border-color: var(--gold);
      opacity: 0.75;
    }

    .corner.top-right {
      top: 30px;
      right: 0;
      border-top: 2px solid;
      border-right: 2px solid;
    }

    .corner.bottom-left {
      bottom: 30px;
      left: 0;
      border-bottom: 2px solid;
      border-left: 2px solid;
    }

    /* الاسم العربي */
    .arabic-name {
      font-family: "Cairo", sans-serif;
      font-size: clamp(42px, 7vw, 86px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -2px;
      color: var(--white);
      text-shadow:
        0 0 25px rgba(255,255,255,0.05);
      margin-bottom: 18px;
    }

    .arabic-name span {
      color: var(--gold-light);
    }

    /* الاسم الإنجليزي */
    .english-name {
      direction: ltr;
      font-family: "Inter", sans-serif;
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 500;
      letter-spacing: 2px;
      color: #d7d9dc;
      margin-bottom: 28px;
    }

    /* الخط الذهبي */
    .gold-line {
      width: 150px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        var(--gold-light),
        var(--gold),
        transparent
      );
      box-shadow: 0 0 18px rgba(212,175,55,0.4);
      margin-bottom: 38px;
    }

    /* الصورة */
    .photo-frame {
      position: relative;
      width: min(430px, 82vw);
      aspect-ratio: 4 / 5;
      padding: 10px;
      margin: 10px auto 38px;
    }

    .photo-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(212,175,55,0.8);
      border-radius: 28px 28px 65px 65px;
      transform: rotate(-1.5deg);
      box-shadow:
        0 0 35px rgba(212,175,55,0.10),
        inset 0 0 30px rgba(212,175,55,0.04);
    }

    .photo-frame::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 24px 24px 58px 58px;
      transform: rotate(1.5deg);
    }

    .profile-photo {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 20px 20px 52px 52px;
      border: 4px solid #08172a;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    /* نبذة */
    .quote {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 500;
      color: var(--white);
      margin-bottom: 28px;
    }

    /* الروابط */
    .links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      direction: rtl;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 180px;
      justify-content: center;
      padding: 14px 24px;
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 999px;
      color: var(--white);
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      background: rgba(255,255,255,0.025);
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .link:hover {
      transform: translateY(-4px);
      border-color: var(--gold-light);
      background: rgba(212,175,55,0.08);
      box-shadow: 0 10px 35px rgba(212,175,55,0.12);
    }

    .link .icon {
      color: var(--gold-light);
      font-size: 18px;
    }

    /* الفوتر */
    footer {
      border-top: 1px solid rgba(212,175,55,0.15);
      padding: 34px 20px;
      text-align: center;
      background: rgba(2,8,17,0.65);
    }

    footer .footer-name {
      font-family: "Inter", sans-serif;
      direction: ltr;
      font-size: 14px;
      color: #8d939b;
      letter-spacing: 1px;
    }

    footer .mbk {
      color: var(--gold);
      margin-top: 8px;
      font-family: "Inter", sans-serif;
      font-weight: 700;
      letter-spacing: 5px;
    }

    /* الجوال */
    @media (max-width: 600px) {

      header {
        height: 72px;
        padding: 0 22px;
      }

      .brand {
        font-size: 20px;
        letter-spacing: 5px;
      }

      .header-title {
        font-size: 13px;
      }

      main {
        width: 90%;
        padding: 45px 0 65px;
      }

      .hero {
        min-height: calc(100vh - 137px);
      }

      .arabic-name {
        font-size: clamp(40px, 11vw, 58px);
        letter-spacing: -1.5px;
        white-space: nowrap;
      }

      .english-name {
        font-size: 18px;
        letter-spacing: 1px;
      }

      .gold-line {
        width: 110px;
        margin-bottom: 28px;
      }

      .photo-frame {
        width: min(350px, 88vw);
        margin-bottom: 30px;
      }

      .quote {
        font-size: 21px;
      }

      .links {
        width: 100%;
        flex-direction: column;
      }

      .link {
        width: min(330px, 100%);
      }

      .corner {
        width: 48px;
        height: 48px;
      }

      .corner.top-right {
        top: 10px;
      }

      .corner.bottom-left {
        bottom: 10px;
      }
    }

    /* حركة دخول ناعمة */
    .hero > * {
      animation: reveal 0.9s ease both;
    }

    .arabic-name {
      animation-delay: 0.05s;
    }

    .english-name {
      animation-delay: 0.15s;
    }

    .gold-line {
      animation-delay: 0.25s;
    }

    .photo-frame {
      animation-delay: 0.35s;
    }

    .quote {
      animation-delay: 0.45s;
    }

    .links {
      animation-delay: 0.55s;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="gold-glow"></div>

  <header>
    <div class="header-title">الموقع الشخصي</div>

    <div class="brand">MBK</div>
  </header>

  <main>

    <section class="hero">

      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>

      <!-- الاسم العربي -->
      <h1 class="arabic-name">
        مبخوت <span>بن عبدالله</span>
      </h1>

      <!-- الاسم الإنجليزي -->
      <div class="english-name">
        Mabkhout Bin Abdullah
      </div>

      <div class="gold-line"></div>

      <!-- الصورة -->
      <div class="photo-frame">
        <img
          class="profile-photo"
          src="file_00000000582882468daa3e8113233056.png"
          alt="Mabkhout Bin Abdullah"
          loading="eager"
        >
      </div>

      <!-- النبذة -->
      <p class="quote">
        وما توفيقي إلا بالله
      </p>

      <!-- الروابط -->
      <div class="links">

        <a
          class="link"
          href="mailto:Mabkhut505g@gmail.com"
        >
          <span class="icon">✉</span>
          البريد الإلكتروني
        </a>

        <a
          class="link"
          href="https://www.facebook.com/share/19JG7PQiHL/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">f</span>
          Facebook
        </a>

      </div>

    </section>

  </main>

  <footer>

    <div class="footer-name">
      Mabkhout Bin Abdullah 2026 ©
    </div>

    <div class="mbk">
      MBK
    </div>

  </footer>

</body>
</html>
