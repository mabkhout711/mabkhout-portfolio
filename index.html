<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مبخوت بن عبدالله | Mabkhout Bin Abdullah</title>

    <meta name="description"
        content="Mabkhout Bin Abdullah — Personal Website">

    <meta name="theme-color" content="#071426">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --navy: #050d1a;
            --navy-2: #09182b;
            --gold: #d4af37;
            --gold-light: #f3dc83;
            --white: #ffffff;
            --muted: #aab4c3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--white);
            font-family: "Cairo", sans-serif;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(212,175,55,.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(17,51,88,.3),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #030812,
                    var(--navy),
                    #07172b
                );
        }

        /* خلفية شبكية ناعمة */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .35;

            background:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 80px 80px;
        }

        /* توهج ذهبي */

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;

            background: rgba(212,175,55,.045);
            filter: blur(100px);
        }

        /* الهيدر */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 78px;

            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 100;

            background: rgba(3,10,20,.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(212,175,55,.12);
        }

        .logo {
            color: var(--gold-light);
            font-family: "Inter", sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 6px;
        }

        .year {
            color: rgba(255,255,255,.38);
            font-family: "Inter", sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
        }

        /* المحتوى */

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 120px 20px 60px;
        }

        .hero {
            width: min(100%, 900px);
            text-align: center;

            animation: entrance 1.2s ease forwards;
        }

        @keyframes entrance {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الصورة */

        .profile {
            position: relative;
            width: 190px;
            height: 190px;

            margin: 0 auto 38px;
        }

        .profile::before {
            content: "";
            position: absolute;
            inset: -10px;

            border-radius: 50%;

            background:
                conic-gradient(
                    var(--gold),
                    var(--gold-light),
                    #8f6d16,
                    var(--gold)
                );

            animation: rotate 8s linear infinite;

            box-shadow:
                0 0 35px rgba(212,175,55,.18);
        }

        .profile::after {
            content: "";
            position: absolute;
            inset: -25px;

            border-radius: 50%;

            border: 1px solid rgba(212,175,55,.13);
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        .profile img {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            object-fit: cover;
            border-radius: 50%;

            border: 6px solid var(--navy);

            background: var(--navy-2);

            display: block;
        }

        /* العنوان الصغير */

        .eyebrow {
            color: var(--gold-light);

            font-family: "Inter", sans-serif;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 5px;

            margin-bottom: 18px;
        }

        /* الاسم العربي */

        h1 {
            font-size: clamp(42px, 8vw, 78px);

            line-height: 1.2;

            font-weight: 800;

            color: #fff;

            text-shadow:
                0 12px 40px rgba(0,0,0,.4);
        }

        /* الاسم الإنجليزي */

        .english-name {
            direction: ltr;

            margin-top: 14px;

            color: var(--gold-light);

            font-family: "Inter", sans-serif;

            font-size: clamp(22px, 4vw, 36px);

            font-weight: 600;

            letter-spacing: -.5px;
        }

        /* الخط */

        .ornament {
            width: 120px;
            height: 1px;

            margin: 28px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
                );

            position: relative;
        }

        .ornament::after {
            content: "";
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--gold);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            box-shadow:
                0 0 12px var(--gold);
        }

        /* العبارة */

        .motto {
            font-size: clamp(20px, 3vw, 27px);

            color: #f7f7f7;

            font-weight: 500;

            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted);

            font-size: 14px;

            line-height: 2;

            max-width: 550px;

            margin: auto;
        }

        /* الأزرار */

        .actions {
            margin-top: 34px;

            display: flex;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .button {
            min-width: 205px;

            padding: 15px 25px;

            border-radius: 14px;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-size: 14px;

            font-weight: 700;

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                background .3s ease;
        }

        .button-gold {
            color: #081323;

            background:
                linear-gradient(
                    135deg,
                    #aa8420,
                    #f0d56e,
                    #bd952a
                );

            box-shadow:
                0 12px 35px rgba(212,175,55,.15);
        }

        .button-outline {
            color: white;

            background:
                rgba(255,255,255,.035);

            border: 1px solid rgba(212,175,55,.45);
        }

        .button:hover {
            transform: translateY(-5px);

            box-shadow:
                0 18px 40px rgba(0,0,0,.3),
                0 0 25px rgba(212,175,55,.1);
        }

        /* معلومات صغيرة */

        .details {
            margin: 65px auto 0;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 35px;

            color: rgba(255,255,255,.35);

            font-family: "Inter", sans-serif;

            font-size: 10px;

            letter-spacing: 2px;
        }

        .details span:nth-child(2) {
            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: var(--gold);

            box-shadow:
                0 0 10px var(--gold);
        }

        /* الجوال */

        @media (max-width: 600px) {

            header {
                height: 65px;
                padding: 0 22px;
            }

            .logo {
                font-size: 18px;
                letter-spacing: 4px;
            }

            .year {
                font-size: 8px;
            }

            main {
                padding:
                    105px 18px 45px;
            }

            .profile {
                width: 145px;
                height: 145px;

                margin-bottom: 30px;
            }

            .profile::before {
                inset: -7px;
            }

            .profile::after {
                inset: -18px;
            }

            .eyebrow {
                font-size: 8px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 40px;
            }

            .english-name {
                font-size: 22px;

                line-height: 1.5;
            }

            .motto {
                font-size: 19px;
            }

            .subtitle {
                font-size: 13px;
            }

            .actions {
                flex-direction: column;

                align-items: center;
            }

            .button {
                width: min(100%, 330px);
            }

            .details {
                margin-top: 45px;

                gap: 20px;

                font-size: 8px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        MBK
    </div>

    <div class="year">
        2026
    </div>

</header>

<main>

    <section class="hero">

        <!-- الصورة -->
        <div class="profile">

            <img
                src="profile.jpg"
                alt="مبخوت بن عبدالله"

        </div>

        </div>

        <!-- الاسم العربي -->
        <h1>

        <!-- الاسم الإنجليزي -->
        <div class="english-name">

        <div class="motto">

        </p>

        <div class="actions">

            <!-- البريد -->
            <a

            <a
                class="button button-outline"

        </div>

        <div class="details">

            <span>PERSONAL WEBSITE</span>

            <span></span>

            <span>MABKHOUT BIN ABDULLAH</span>

        </div>

    </section>

</main>

<script>

    /* تأثير Parallax خفيف للبطاقة */

    const hero = document.querySelector(".hero");

    document.addEventListener("mousemove", (event) => {

        if (window.innerWidth <= 700) return;

        const x =
            (event.clientX / window.innerWidth - .5) * 4;

        const y =
            (event.clientY / window.innerHeight - .5) * -4;

        hero.style.transform =
            `perspective(1200px) rotateY(${x}deg) rotateX(${y}deg)`;

    });

    document.addEventListener("mouseleave", () => {

        hero.style.transform =
            "perspective(1200px) rotateY(0deg) rotateX(0deg)";

    });

</script>

</body>
</html>
