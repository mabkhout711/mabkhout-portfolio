<style>

:root{
    --navy:#061426;
    --navy-dark:#020914;
    --navy-soft:#0a1d33;

    --gold:#d4af37;
    --gold-light:#f1d56a;

    --white:#f8f7f2;
    --text:#d8dce2;
    --muted:#8995a3;

    --border:rgba(212,175,55,.20);
    --border-strong:rgba(212,175,55,.42);

    --glass:rgba(255,255,255,.035);
    --shadow:rgba(0,0,0,.45);

    --radius-lg:30px;
    --radius-md:24px;

    --header-height:76px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:90px;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    font-family:
        "Cairo",
        "Noto Kufi Arabic",
        Arial,
        sans-serif;

    color:var(--white);

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(212,175,55,.08),
            transparent 27%
        ),
        radial-gradient(
            circle at 0% 50%,
            rgba(16,50,82,.32),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #020914 0%,
            #061426 48%,
            #030b16 100%
        );
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-10;

    opacity:.055;

    background-image:
        linear-gradient(
            rgba(255,255,255,.05) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.05) 1px,
            transparent 1px
        );

    background-size:75px 75px;
}

body::after{
    content:"";

    position:fixed;

    width:450px;
    height:450px;

    top:12%;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(212,175,55,.035);

    filter:blur(120px);

    pointer-events:none;

    z-index:-9;
}

img{
    max-width:100%;
}

button,
a{
    font:inherit;
}

button{
    border:0;
}

a{
    color:inherit;
    text-decoration:none;

    -webkit-tap-highlight-color:transparent;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

.skip-link{
    position:fixed;

    top:12px;
    right:12px;

    z-index:9999;

    padding:10px 16px;

    border-radius:999px;

    background:var(--gold);

    color:#020914;

    font-weight:700;

    transform:translateY(-150%);

    transition:.25s ease;
}

.skip-link:focus{
    transform:translateY(0);
}

.site-header{
    position:fixed;

    top:0;
    right:0;
    left:0;

    height:var(--header-height);

    padding:0 6%;

    display:flex;

    align-items:center;
    justify-content:space-between;

    z-index:1000;

    background:
        rgba(2,9,20,.76);

    border-bottom:
        1px solid rgba(212,175,55,.12);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.logo{
    direction:ltr;

    font-family:
        Arial,
        sans-serif;

    font-size:23px;

    font-weight:700;

    letter-spacing:7px;

    color:var(--gold-light);

    transition:.3s ease;
}

.logo:hover{
    color:#fff0a3;
    transform:translateY(-1px);
}

.header-actions{
    display:flex;

    align-items:center;

    gap:10px;
}

.icon-btn{
    width:47px;
    height:47px;

    border-radius:50%;

    border:
        1px solid var(--border-strong);

    background:
        rgba(255,255,255,.025);

    color:var(--gold-light);

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;

    transition:.3s ease;
}

.icon-btn:hover{
    transform:scale(1.05);

    border-color:var(--gold-light);

    background:
        rgba(212,175,55,.08);

    box-shadow:
        0 0 30px rgba(212,175,55,.12);
}

.overlay{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:blur(5px);

    z-index:1100;

    opacity:0;

    visibility:hidden;

    transition:.35s ease;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.side-menu{
    position:fixed;

    top:0;
    right:0;

    width:min(390px,88vw);

    height:100vh;

    padding:
        92px
        35px
        35px;

    z-index:1200;

    background:
        linear-gradient(
            150deg,
            rgba(8,26,47,.99),
            rgba(2,9,20,.99)
        );

    border-left:
        1px solid var(--border);

    transform:
        translateX(105%);

    transition:
        transform .45s cubic-bezier(.77,0,.18,1);

    box-shadow:
        -30px 0 90px rgba(0,0,0,.45);

    overflow-y:auto;
}

.side-menu.active{
    transform:translateX(0);
}

.close-menu{
    position:absolute;

    top:24px;
    left:24px;

    width:42px;
    height:42px;

    border-radius:50%;

    border:
        1px solid var(--border-strong);

    background:transparent;

    color:var(--gold-light);

    cursor:pointer;

    font-size:22px;

    transition:.3s ease;
}

.close-menu:hover{
    background:
        rgba(212,175,55,.08);

    transform:rotate(90deg);
}

.menu-brand{
    direction:ltr;

    font-family:Arial,sans-serif;

    font-size:30px;

    font-weight:800;

    letter-spacing:8px;

    color:var(--gold-light);

    margin-bottom:18px;
}

.menu-label{
    color:var(--gold);

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:28px;

    direction:ltr;

    text-align:right;
}

.side-menu a{
    display:block;

    padding:17px 0;

    border-bottom:
        1px solid rgba(255,255,255,.055);

    font-size:17px;

    color:var(--white);

    transition:.3s ease;
}

.side-menu a:hover{
    color:var(--gold-light);

    padding-right:10px;
}

main{
    width:min(1120px,92%);

    margin:auto;
}

.section-anchor{
    scroll-margin-top:90px;
}
