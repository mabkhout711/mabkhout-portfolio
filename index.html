<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مبخوت بن عبدالله</title>

<meta
    name="description"
    content="الموقع الشخصي لمبخوت بن عبدالله"
>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* ========================================
   ROOT
======================================== */

:root{

    --navy:#061426;

    --navy-dark:#020914;

    --navy-light:#0b1e35;

    --gold:#d4af37;

    --gold-light:#f2d76b;

    --white:#f8f7f2;

    --gray:#9da5ae;

}


/* ========================================
   RESET
======================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* ========================================
   HTML
======================================== */

html{

    scroll-behavior:smooth;

}


/* ========================================
   BODY
======================================== */

body{

    min-height:100vh;

    overflow-x:hidden;

    color:var(--white);

    font-family:"Cairo",sans-serif;

    background:

        radial-gradient(
            circle at 50% 38%,
            rgba(212,175,55,.10),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            var(--navy-dark),
            var(--navy) 50%,
            #030b16
        );

}


/* ========================================
   BACKGROUND GRID
======================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.16;

    background-image:

        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:70px 70px;

}


/* ========================================
   GOLD GLOW
======================================== */

.gold-glow{

    position:fixed;

    width:420px;

    height:420px;

    border-radius:50%;

    top:25%;

    left:50%;

    transform:translateX(-50%);

    background:
        rgba(212,175,55,.08);

    filter:blur(90px);

    pointer-events:none;

}


/* ========================================
   HEADER
======================================== */

header{

    height:82px;

    padding:0 7%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:relative;

    z-index:10;

    background:
        rgba(2,9,20,.88);

    border-bottom:
        1px solid
        rgba(212,175,55,.15);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

}


/* ========================================
   MBK LOGO
======================================== */

.brand{

    direction:ltr;

    font-family:Arial,sans-serif;

    font-size:25px;

    font-weight:700;

    letter-spacing:8px;

    color:var(--gold-light);

    text-shadow:
        0 0 20px
        rgba(212,175,55,.18);

}


/* ========================================
   HEADER TITLE
======================================== */

.header-title{

    font-size:15px;

    font-weight:500;

    color:#c4c8ce;

}


/* ========================================
   MAIN
======================================== */

main{

    width:min(1050px,92%);

    margin:auto;

}


/* ========================================
   HERO
======================================== */

.hero{

    min-height:
        calc(100vh - 82px);

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        70px 0 90px;

    text-align:center;

    position:relative;

}


/* ========================================
   GOLD CORNERS
======================================== */

.corner{

    position:absolute;

    width:72px;

    height:72px;

    border-color:
        rgba(212,175,55,.8);

}


.corner.one{

    top:42px;

    right:0;

    border-top:2px solid;

    border-right:2px solid;

}


.corner.two{

    bottom:45px;

    left:0;

    border-bottom:2px solid;

    border-left:2px solid;

}


/* ========================================
   NAME
======================================== */

.name{

    font-family:"Cairo",sans-serif;

    font-size:
        clamp(42px,8vw,82px);

    font-weight:800;

    line-height:1.25;

    letter-spacing:-2px;

    color:var(--white);

    margin-top:18px;

    margin-bottom:22px;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.35);

    animation:
        reveal .9s ease both;

}


.name span{

    color:var(--gold-light);

    text-shadow:
        0 0 25px
        rgba(212,175,55,.12);

}


/* ========================================
   GOLD LINE
======================================== */

.gold-line{

    width:150px;

    height:2px;

    margin-bottom:48px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            var(--gold-light),
            var(--gold),
            transparent
        );

    box-shadow:
        0 0 20px
        rgba(212,175,55,.45);

    animation:
        reveal .9s .15s ease both;

}


/* ========================================
   PHOTO FRAME
   1:1
======================================== */

.photo-frame{

    width:min(470px,88vw);

    aspect-ratio:1 / 1;

    position:relative;

    padding:11px;

    margin-bottom:42px;

    animation:
        reveal .9s .25s ease both;

}


/* OUTER FRAME */

.photo-frame::before{

    content:"";

    position:absolute;

    inset:0;

    border:
        1px solid
        rgba(212,175,55,.9);

    border-radius:32px;

    transform:rotate(-1.2deg);

    box-shadow:
        0 0 45px
        rgba(212,175,55,.09);

}


/* INNER FRAME */

.photo-frame::after{

    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(212,175,55,.28);

    border-radius:27px;

    transform:rotate(1.2deg);

}


/* ========================================
   PROFILE IMAGE
======================================== */

.profile-photo{

    width:100%;

    height:100%;

    display:block;

    position:relative;

    z-index:2;

    object-fit:contain;

    border-radius:24px;

    border:
        5px solid
        #07172a;

    background:#07172a;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.5);

    transition:
        transform .5s ease,
        box-shadow .5s ease;

}


.photo-frame:hover .profile-photo{

    transform:
        scale(1.015);

    box-shadow:
        0 30px 85px
        rgba(212,175,55,.16);

}


/* ========================================
   QUOTE
======================================== */

.quote{

    font-size:
        clamp(22px,4vw,30px);

    font-weight:500;

    color:var(--white);

    margin-bottom:28px;

    animation:
        reveal .9s .35s ease both;

}


/* ========================================
   SOCIAL LINKS
======================================== */

.links{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:18px;

    animation:
        reveal .9s .45s ease both;

}


/* ========================================
   SOCIAL ICON BUTTON
======================================== */

.social-icon{

    width:62px;

    height:62px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    border:
        1px solid
        rgba(212,175,55,.48);

    background:

        linear-gradient(
            145deg,
            rgba(212,175,55,.10),
            rgba(255,255,255,.025)
        );

    color:var(--gold-light);

    text-decoration:none;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    transition:

        transform .3s ease,

        border-color .3s ease,

        background .3s ease,

        box-shadow .3s ease;

}


/* ICON */

.social-icon svg{

    width:27px;

    height:27px;

    fill:currentColor;

    transition:

        transform .3s ease,

        filter .3s ease;

}


/* HOVER */

.social-icon:hover{

    transform:
        translateY(-5px)
        scale(1.04);

    border-color:
        var(--gold-light);

    background:
        rgba(212,175,55,.12);

    box-shadow:
        0 14px 40px
        rgba(212,175,55,.18);

}


.social-icon:hover svg{

    transform:
        scale(1.08);

    filter:
        drop-shadow(
            0 0 7px
            rgba(242,215,107,.45)
        );

}


/* ========================================
   FOOTER
======================================== */

footer{

    padding:
        32px 20px;

    text-align:center;

    background:
        rgba(2,8,17,.7);

    border-top:
        1px solid
        rgba(212,175,55,.14);

}


.footer-name{

    font-size:14px;

    color:#8f969f;

}


.footer-mbk{

    direction:ltr;

    margin-top:8px;

    color:var(--gold);

    font-family:Arial,sans-serif;

    font-size:14px;

    font-weight:700;

    letter-spacing:5px;

}


/* ========================================
   ANIMATION
======================================== */

@keyframes reveal{

    from{

        opacity:0;

        transform:
            translateY(20px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* ========================================
   MOBILE
======================================== */

@media(max-width:600px){

    header{

        height:72px;

        padding:
            0 22px;

    }


    .brand{

        font-size:21px;

        letter-spacing:6px;

    }


    .header-title{

        font-size:13px;

    }


    .hero{

        padding:
            48px 0 70px;

    }


    .name{

        font-size:
            clamp(40px,11vw,58px);

        letter-spacing:-1.5px;

        line-height:1.35;

        margin-bottom:20px;

    }


    .gold-line{

        width:110px;

        margin-bottom:38px;

    }


    .photo-frame{

        width:
            min(390px,88vw);

        aspect-ratio:1 / 1;

        margin-bottom:35px;

    }


    .profile-photo{

        object-fit:contain;

    }


    .quote{

        font-size:21px;

        margin-bottom:25px;

    }


    .links{

        gap:15px;

    }


    .social-icon{

        width:58px;

        height:58px;

    }


    .social-icon svg{

        width:25px;

        height:25px;

    }


    .corner{

        width:48px;

        height:48px;

    }


    .corner.one{

        top:15px;

    }


    .corner.two{

        bottom:20px;

    }


    footer{

        padding:
            28px 15px;

    }


    .footer-name{

        font-size:12px;

    }

}


/* ========================================
   REDUCED MOTION
======================================== */

@media(prefers-reduced-motion:reduce){

    *{

        animation:none !important;

        transition:none !important;

    }

}

</style>

</head>


<body>


<div class="gold-glow"></div>


<!-- ======================================
     HEADER
====================================== -->

<header>

    <div class="brand">
        MBK
    </div>

    <div class="header-title">
        الموقع الشخصي
    </div>

</header>


<!-- ======================================
     MAIN
====================================== -->

<main>

<section class="hero">


    <!-- GOLD CORNERS -->

    <div class="corner one"></div>

    <div class="corner two"></div>


    <!-- NAME -->

    <h1 class="name">

        مبخوت
        <span>بن عبدالله</span>

    </h1>


    <!-- GOLD LINE -->

    <div class="gold-line"></div>


    <!-- PROFILE PHOTO -->

    <div class="photo-frame">

        <img

            class="profile-photo"

            src="file_00000000202482468d4027eb8c5919f7.png"

            alt="مبخوت بن عبدالله"

            loading="eager"

        >

    </div>


    <!-- QUOTE -->

    <p class="quote">

        وما توفيقي إلا بالله

    </p>


    <!-- SOCIAL ICONS -->

    <div class="links">


        <!-- EMAIL -->

        <a

            class="social-icon"

            href="mailto:mabkhout@mabkhut.com"

            aria-label="البريد الإلكتروني"

            title="البريد الإلكتروني"

        >

            <svg

                viewBox="0 0 24 24"

                aria-hidden="true"

            >

                <path d="M3 5h18v14H3V5zm2 2v.5l7 5 7-5V7l-7 5-7-5z"/>

            </svg>

        </a>


        <!-- FACEBOOK -->

        <a

            class="social-icon"

            href="https://www.facebook.com/share/19JG7PQiHL/"

            target="_blank"

            rel="noopener noreferrer"

            aria-label="Facebook"

            title="Facebook"

        >

            <svg

                viewBox="0 0 24 24"

                aria-hidden="true"

            >

                <path d="M14 8h3V4h-3c-3.31 0-5 1.69-5 5v2H6v4h3v5h4v-5h3l1-4h-4V9c0-.67.33-1 1-1z"/>

            </svg>

        </a>


    </div>


</section>

</main>


<!-- ======================================
     FOOTER
====================================== -->

<footer>

    <div class="footer-name">

        © 2026 مبخوت بن عبدالله — جميع الحقوق محفوظة

    </div>


    <div class="footer-mbk">

        MBK

    </div>

</footer>


</body>

</html>
