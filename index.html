
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مبخوت بن عبدالله | Mabkhout Bin Abdullah</title>

    <meta name="description" content="الموقع الشخصي لمبخوت بن عبدالله">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --navy: #061326;
            --navy-light: #0d2039;
            --gold: #d4af37;
            --gold-light: #f4df8b;
            --white: #ffffff;
            --muted: #aeb8c7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            color: var(--white);

            font-family: "Cairo", sans-serif;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(212,175,55,.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #020813,
                    #061326 50%,
                    #030914
                );
        }

        /* خلفية فاخرة */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 90px 90px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );
        }

        /* الهيدر */

        header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 76px;

            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 100;

            background: rgba(2,8,19,.72);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(212,175,55,.12);
        }

        .logo {
            font-family: "Inter", sans-serif;

            color: var(--gold-light);

            font-size: 22px;
            font-weight: 800;

            letter-spacing: 6px;
        }

        .year {
            font-family: "Inter", sans-serif;

            color: rgba(255,255,255,.35);

            font-size: 10px;

            letter-spacing: 4px;
        }

        /* الصفحة */

        main {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                120px 30px 70px;
        }

        .hero {
            width: min(1180px, 100%);

            display: grid;

            grid-template-columns:
                1fr
                360px
                1fr;

            align-items: center;

            gap: 55px;

            position: relative;

            animation:
                entrance 1.1s ease forwards;
        }

        @keyframes entrance {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* الاسم العربي */

        .arabic-side {
            text-align: right;

            padding-right: 10px;
        }

        .small-title {
            color: var(--gold);

            font-family: "Inter", sans-serif;

            font-size: 10px;

            letter-spacing: 4px;

            margin-bottom: 18px;
        }

        .arabic-name {

            font-size:
                clamp(38px, 5vw, 65px);

            line-height: 1.25;

            font-weight: 800;

            color: var(--white);

            text-shadow:
                0 15px 40px rgba(0,0,0,.45);
        }

        .arabic-line {

            width: 90px;

            height: 2px;

            margin-top: 25px;

            margin-right: 0;

            background:
                linear-gradient(
                    90deg,
                    var(--gold),
                    transparent
                );
        }

        /* الصورة */

        .portrait {

            width: 330px;
            height: 430px;

            margin: auto;

            position: relative;
        }

        .portrait-frame {

            position: absolute;

            inset: 0;

            border-radius: 165px 165px 25px 25px;

            border:
                1px solid rgba(212,175,55,.65);

            transform:
                rotate(3deg);

            transition:
                transform .5s ease;
        }

        .portrait:hover .portrait-frame {

            transform:
                rotate(0deg)
                scale(1.02);
        }

        .portrait-frame::before {

            content: "";

            position: absolute;

            inset: 9px;

            border:
                1px solid
                rgba(212,175,55,.25);

            border-radius:
                155px 155px 18px 18px;
        }

        .portrait-glow {

            position: absolute;

            width: 260px;
            height: 260px;

            left: 50%;
            top: 45%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(212,175,55,.12);

            filter: blur(65px);

            pointer-events: none;
        }

        .portrait img {

            position: absolute;

            inset: 15px;

            width:
                calc(100% - 30px);

            height:
                calc(100% - 30px);

            object-fit: cover;

            border-radius:
                150px 150px 18px 18px;

            border:
                5px solid var(--navy);

            z-index: 2;

            background:
                linear-gradient(
                    145deg,
                    #132945,
                    #061326
                );

            display: block;
        }

        /* الاسم الإنجليزي */

        .english-side {

            direction: ltr;

            text-align: left;

            padding-left: 10px;
        }

        .english-name {

            font-family: "Inter", sans-serif;

            font-size:
                clamp(30px, 4vw, 52px);

            line-height: 1.15;

            font-weight: 600;

            color: var(--gold-light);

            letter-spacing: -1.5px;
        }

        .english-line {

            width: 100px;

            height: 2px;

            margin-top: 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold)
                );
        }

        .motto {

            margin-top: 45px;

            color: var(--white);

            font-size: 21px;

            font-weight: 500;

            direction: rtl;
        }

        /* الأزرار */

        .actions {

            margin-top: 28px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .button {

            padding:
                12px 20px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 13px;

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                background .3s ease;
        }

        .gold-button {

            color: #071426;

            background:
                linear-gradient(
                    135deg,
                    #ad861f,
                    #f3d975,
                    #b88f24
                );

            font-weight: 700;
        }

        .outline-button {

            color: white;

            border:
                1px solid
                rgba(212,175,55,.5);

            background:
                rgba(255,255,255,.025);
        }

        .button:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,.25);
        }

        /* MBK */

        .monogram {

            position: absolute;

            left: 50%;

            bottom: -65px;

            transform:
                translateX(-50%);

            color:
                rgba(212,175,55,.10);

            font-family:
                "Inter", sans-serif;

            font-size: 100px;

            font-weight: 800;

            letter-spacing: 20px;

            pointer-events: none;
        }

        /* الجوال */

        @media (max-width: 850px) {

            main {

                padding:
                    110px 20px 60px;
            }

            .hero {

                grid-template-columns: 1fr;

                gap: 38px;

                text-align: center;
            }

            .arabic-side,
            .english-side {

                padding: 0;

                text-align: center;
            }

            .arabic-side {

                order: 1;
            }

            .portrait {

                order: 2;

                width: 270px;
                height: 350px;
            }

            .english-side {

                order: 3;

                direction: ltr;
            }

            .arabic-line,
            .english-line {

                margin-left: auto;
                margin-right: auto;
            }

            .english-line {

                background:
                    linear-gradient(
                        90deg,
                        transparent,
                        var(--gold),
                        transparent
                    );
            }

            .motto {

                margin-top: 28px;
            }

            .actions {

                justify-content: center;
            }

            .monogram {

                bottom: -30px;

                font-size: 65px;
            }
        }

        @media (max-width: 500px) {

            header {

                height: 65px;

                padding:
                    0 20px;
            }

            .logo {

                font-size: 18px;

                letter-spacing: 4px;
            }

            .year {

                font-size: 8px;
            }

            .arabic-name {

                font-size: 38px;
            }

            .english-name {

                font-size: 28px;
            }

            .portrait {

                width: 235px;
                height: 310px;
            }

            .motto {

                font-size: 18px;
            }

            .button {

                width: 100%;

                text-align: center;
            }

            .actions {

                width: 100%;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        MBK
    </div>

    <div class="year">
        2026
    </div>

</header>


<main>

    <section class="hero">

        <!-- الاسم العربي -->

        <div class="arabic-side">

            <div class="small-title">
                الملف الشخصي
            </div>

            <h1 class="arabic-name">
                مبخوت<br>
                بن عبدالله
            </h1>

            <div class="arabic-line"></div>

        </div>


        <!-- الصورة -->

        <div class="portrait">

            <div class="portrait-glow"></div>

            <div class="portrait-frame"></div>

            <img
                src="profile.jpg"
                alt="مبخوت بن عبدالله"
            >

        </div>


        <!-- الاسم الإنجليزي -->

        <div class="english-side">

            <div class="small-title">
                PERSONAL PROFILE
            </div>

            <h2 class="english-name">
                Mabkhout<br>
                Bin Abdullah
            </h2>

            <div class="english-line"></div>

            <div class="motto">
                وما توفيقي إلا بالله
            </div>

            <div class="actions">

                <a
                    href="mailto:Mabkhut505g@gmail.com"
                    class="button gold-button"
                >
                    Email
                </a>

                <a
                    href="YOUR_FACEBOOK_LINK"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="button outline-button"
                >
                    Facebook
                </a>

            </div>

        </div>

        <div class="monogram">
            MBK
        </div>

    </section>

</main>


<script>

    const hero =
        document.querySelector(".hero");

    document.addEventListener(
        "mousemove",
        (event) => {

            if (
                window.innerWidth <= 850
            ) return;

            const x =
                (event.clientX /
                window.innerWidth - .5) * 2;

            const y =
                (event.clientY /
                window.innerHeight - .5) * 2;

            hero.style.transform =
                `perspective(1400px)
                 rotateY(${x}deg)
                 rotateX(${-y}deg)`;

        }
    );

    document.addEventListener(
        "mouseleave",
        () => {

            hero.style.transform =
                "perspective(1400px) rotateY(0deg) rotateX(0deg)";

        }
    );

</script>

</body>
</html>
