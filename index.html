}

    content:"";

    position:absolute;

    inset:-18px;

    border-radius:40px;

    background:

            rgba(212,175,55,.22),

    filter:

.hero-sweep{

    position:absolute;

    inset:0;

    border-radius:30px;

    overflow:hidden;

    z-index:5;

    pointer-events:none;

.hero-sweep::after{

    content:"";

    position:absolute;

    top:-30%;

    right:-100%;

    width:35%;

    height:160%;

    transform:rotate(18deg);

    background:

            transparent,
            rgba(255,255,255,.16),

        );

    animation:
        sweep 5s infinite;

        right:170%;
    }

}

.hero-quote{

    }

@keyframes heroIn{

    to{
        opacity:1;
        transform:translateY(0);

    }

<!-- سكريبت التحميل للعداد وإخفاء الشاشة الافتتاحية -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const intro = document.getElementById('intro');
        const introPercent = document.getElementById('introPercent');
        const introLine = document.getElementById('introLine');
        
        let progress = 0;
        
        // محاكاة عملية التحميل
        const loadingInterval = setInterval(() => {
            // زيادة العداد برقم عشوائي بين 5 و 15
            progress += Math.floor(Math.random() * 10) + 5; 
            
            if (progress > 100) {
                progress = 100;
            }
            
            if (introPercent) {
                introPercent.innerText = progress + '%';
            }
            if (introLine) {
                introLine.style.width = progress + '%';
            }
            
            // عند الوصول إلى 100%، إخفاء الشاشة الافتتاحية
            if (progress === 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    if (intro) {
                        intro.classList.add('hide');
                    }
                    document.body.classList.remove('locked'); // لتمكين التمرير
                }, 600); // تأخير بسيط لمدة نصف ثانية لمشاهدة 100%
            }
        }, 150); // سرعة تحديث العداد كل 150 ملي ثانية
    });
</script>
