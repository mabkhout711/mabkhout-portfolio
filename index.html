<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#02050b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>MABKHOUT</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #02050b;
        }


        body {
            min-width: 100%;
            max-width: 100%;

            font-family:
                Arial,
                "Segoe UI",
                Tahoma,
                sans-serif;
        }


        /* =====================================================
           شاشة الدخول
        ===================================================== */

        #loader {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(218, 173, 43, 0.10) 0%,
                    rgba(218, 173, 43, 0.035) 22%,
                    transparent 48%
                ),
                #02050b;

            z-index: 999999;
        }


        /* =====================================================
           شبكة الخلفية
        ===================================================== */

        .grid {

            position: absolute;

            left: -25%;
            right: -25%;
            bottom: -12%;

            width: 150%;
            height: 70%;

            opacity: 0.28;

            background-image:

                linear-gradient(
                    rgba(100, 116, 140, 0.12) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(100, 116, 140, 0.12) 1px,
                    transparent 1px
                );

            background-size:
                75px 75px,
                75px 75px;

            transform:
                perspective(550px)
                rotateX(63deg)
                scale(1.25);

            transform-origin: bottom center;

            pointer-events: none;
        }


        /* =====================================================
           الإضاءة الذهبية
        ===================================================== */

        .gold-glow {

            position: absolute;

            width: 420px;
            height: 420px;

            max-width: 90vw;
            max-height: 90vw;

            left: 50%;
            top: 44%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(225, 179, 45, 0.075);

            filter: blur(85px);

            pointer-events: none;
        }


        /* =====================================================
           محتوى شاشة الدخول
        ===================================================== */

        .loader-content {

            position: relative;

            width: 100%;
            max-width: 760px;

            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding-top:
                max(25px, env(safe-area-inset-top));

            padding-right: 20px;

            padding-bottom:
                max(25px, env(safe-area-inset-bottom));

            padding-left: 20px;

            text-align: center;

            z-index: 10;
        }


        /* =====================================================
           الشعار
        ===================================================== */

        .logo {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            margin-top: -25px;

            animation:
                logoAppear 1.2s ease both;
        }


        /* =====================================================
           MB
        ===================================================== */

        .logo-mark {

            direction: ltr;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(88px, 20vw, 155px);

            line-height: 0.82;

            font-weight: 700;

            letter-spacing: -10px;

            padding-right: 10px;

            color: #e3b52e;

            text-shadow:

                0 0 12px
                rgba(227, 181, 46, 0.18),

                0 0 40px
                rgba(227, 181, 46, 0.10);

            white-space: nowrap;
        }


        /* =====================================================
           MABKHOUT
        ===================================================== */

        .brand-name {

            direction: ltr;

            margin-top: 27px;

            padding-left: 9px;

            color: #768196;

            font-size:
                clamp(13px, 3.4vw, 20px);

            letter-spacing:
                clamp(7px, 2.3vw, 14px);

            font-weight: 400;

            white-space: nowrap;

            animation:
                brandAppear 1s ease 0.2s both;
        }


        /* =====================================================
           مرحباً بك
        ===================================================== */

        .welcome {

            margin-top: 42px;

            color: #f0d477;

            font-size:
                clamp(25px, 6vw, 40px);

            font-weight: 500;

            line-height: 1.4;

            text-shadow:
                0 0 18px
                rgba(240, 212, 119, 0.16);

            animation:
                welcomeAppear 1s ease 0.4s both;
        }


        /* =====================================================
           منطقة التحميل
        ===================================================== */

        .progress-area {

            width: min(92%, 640px);

            margin-top: 55px;

            animation:
                progressAppear 1s ease 0.55s both;
        }


        /* =====================================================
           الخط
        ===================================================== */

        .progress-line {

            position: relative;

            width: 100%;

            height: 3px;

            overflow: hidden;

            background:
                rgba(255, 255, 255, 0.12);
        }


        /* =====================================================
           خط التحميل
        ===================================================== */

        .progress-fill {

            position: absolute;

            top: 0;
            left: 0;

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #b98a16,
                    #dfb536,
                    #f4d66b
                );

            box-shadow:
                0 0 14px
                rgba(223, 181, 54, 0.65);

            transition:
                width 0.08s linear;

            z-index: 2;
        }


        /* =====================================================
           لمعان متحرك
        ===================================================== */

        .progress-line::after {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 222, 108, 0.8),
                    transparent
                );

            animation:
                shine 1.8s linear infinite;

            z-index: 3;
        }


        /* =====================================================
           النسبة
        ===================================================== */

        .percentage {

            margin-top: 29px;

            direction: ltr;

            color: #e5c24b;

            font-size:
                clamp(25px, 6vw, 36px);

            font-weight: 400;

            letter-spacing: 4px;

            text-shadow:
                0 0 12px
                rgba(229, 194, 75, 0.12);
        }


        /* =====================================================
           حالة 100%
        ===================================================== */

        .complete {

            animation:
                completePulse 0.5s ease;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes logoAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.94);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes brandAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes welcomeAppear {

            from {

                opacity: 0;

                transform:
                    translateY(18px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes progressAppear {

            from {

                opacity: 0;

                transform:
                    scaleX(0.8);
            }

            to {

                opacity: 1;

                transform:
                    scaleX(1);
            }
        }


        @keyframes shine {

            from {

                transform:
                    translateX(0);
            }

            to {

                transform:
                    translateX(200%);
            }
        }


        @keyframes completePulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =====================================================
           الجوال
        ===================================================== */

        @media (max-width: 600px) {

            html,
            body {

                width: 100%;
                height: 100%;

                max-width: 100%;

                overflow: hidden;
            }


            #loader {

                width: 100%;
                height: 100%;

                min-height: 100dvh;

                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
            }


            .loader-content {

                width: 100%;
                max-width: 100%;

                padding-left: 20px;
                padding-right: 20px;
            }


            .logo {

                margin-top: -20px;
            }


            .logo-mark {

                font-size: 92px;

                letter-spacing: -8px;
            }


            .brand-name {

                margin-top: 24px;

                font-size: 13px;

                letter-spacing: 8px;

                padding-left: 8px;
            }


            .welcome {

                margin-top: 39px;

                font-size: 28px;
            }


            .progress-area {

                width: calc(100% - 10px);

                margin-top: 52px;
            }


            .progress-line {

                height: 3px;
            }


            .percentage {

                margin-top: 29px;

                font-size: 28px;

                letter-spacing: 4px;
            }
        }


        /* =====================================================
           الجوالات ذات الارتفاع الصغير
        ===================================================== */

        @media (max-height: 700px) {

            .logo {

                margin-top: 0;
            }


            .logo-mark {

                font-size: 76px;
            }


            .brand-name {

                margin-top: 20px;
            }


            .welcome {

                margin-top: 28px;
            }


            .progress-area {

                margin-top: 35px;
            }
        }


        /* =====================================================
           الجوالات الطويلة
        ===================================================== */

        @media (min-height: 800px) and (max-width: 600px) {

            .logo-mark {

                font-size: 100px;
            }


            .brand-name {

                margin-top: 27px;
            }


            .welcome {

                margin-top: 48px;

                font-size: 30px;
            }


            .progress-area {

                margin-top: 60px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         شاشة الدخول الوحيدة
    ===================================================== -->

    <section id="loader">

        <!-- شبكة الخلفية -->
        <div class="grid"></div>

        <!-- الإضاءة الذهبية -->
        <div class="gold-glow"></div>


        <!-- =================================================
             المحتوى
        ================================================= -->

        <div class="loader-content">


            <!-- الشعار -->

            <div class="logo">

                <div class="logo-mark">
                    MB
                </div>


                <div class="brand-name">
                    MABKHOUT
                </div>


                <div class="welcome">
                    مرحباً بك
                </div>

            </div>


            <!-- =================================================
                 التحميل
            ================================================= -->

            <div class="progress-area">


                <div class="progress-line">

                    <div
                        id="progressFill"
                        class="progress-fill">
                    </div>

                </div>


                <div
                    id="percentage"
                    class="percentage">
                    0%
                </div>


            </div>


        </div>

    </section>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        (() => {

            "use strict";


            /* =================================================
               رابط الموقع بعد انتهاء التحميل

               غيّر هذا الرابط فقط إذا كان موقعك في مكان آخر.
            ================================================= */

            const SITE_URL = "https://mabkhout.com/";


            /* =================================================
               العناصر
            ================================================= */

            const progressFill =
                document.getElementById("progressFill");


            const percentage =
                document.getElementById("percentage");


            const loader =
                document.getElementById("loader");


            /* =================================================
               متغيرات التحميل
            ================================================= */

            let progress = 0;

            let finished = false;


            /* =================================================
               سرعة التحميل

               30ms تقريباً لكل درجة
               = حوالي 3 ثوانٍ
            ================================================= */

            const loadingSpeed = 30;


            /* =================================================
               تحديث الشاشة
            ================================================= */

            function updateProgress(value) {

                progress = Math.min(100, value);


                progressFill.style.width =
                    progress + "%";


                percentage.textContent =
                    progress + "%";

            }


            /* =================================================
               الانتقال للموقع
            ================================================= */

            function openWebsite() {

                if (finished) {
                    return;
                }


                finished = true;


                updateProgress(100);


                percentage.classList.add(
                    "complete"
                );


                /*
                 * ننتظر لحظة قصيرة جداً
                 * حتى يرى المستخدم 100%
                 * ثم نفتح الموقع.
                 */

                setTimeout(() => {

                    window.location.replace(
                        SITE_URL
                    );

                }, 500);

            }


            /* =================================================
               تشغيل التحميل
            ================================================= */

            function startLoading() {

                const timer =
                    setInterval(() => {

                        progress += 1;


                        updateProgress(
                            progress
                        );


                        if (progress >= 100) {

                            clearInterval(timer);


                            openWebsite();

                        }

                    }, loadingSpeed);

            }


            /* =================================================
               تشغيل
            ================================================= */

            if (
                document.readyState ===
                "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    startLoading,
                    { once: true }
                );

            } else {

                startLoading();

            }

        })();

    </script>


</body>

</html>
