<!-- =========================================================
     MBK V30 — CINEMATIC MOTION ENGINE
========================================================= -->

<style id="MBK-V30">

/* ---------- V30 CORE ---------- */

:root{
    --v30-gold:#d4af37;
    --v30-gold-light:#fff0a0;
    --v30-blue:#123b62;
}

/* ---------- CINEMATIC AURA ---------- */

body{
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(212,175,55,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 40%,
            rgba(18,59,98,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 75%,
            rgba(212,175,55,.07),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #01060d,
            #061426 45%,
            #020812
        );
}

/* ---------- MOVING AURORA ---------- */

body::after{
    width:700px;
    height:700px;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.055),
            transparent 65%
        );

    filter:blur(100px);

    animation:
        v30Aurora 14s ease-in-out infinite alternate;

    opacity:.9;
}

@keyframes v30Aurora{

    0%{
        transform:
            translate(-50%,-8%)
            scale(.85);
    }

    50%{
        transform:
            translate(-42%,8%)
            scale(1.08);
    }

    100%{
        transform:
            translate(-58%,-3%)
            scale(.92);
    }

}

/* ---------- HERO DEPTH ---------- */

.hero{
    isolation:isolate;
    perspective:1200px;
}

.hero::after{
    content:"";

    position:absolute;

    width:520px;
    height:520px;

    left:50%;
    top:35%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.12),
            transparent 65%
        );

    filter:blur(45px);

    pointer-events:none;

    z-index:-1;

    animation:
        v30HeroGlow 6s ease-in-out infinite;
}

@keyframes v30HeroGlow{

    0%,100%{
        opacity:.35;
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    50%{
        opacity:.8;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

}

/* ---------- GOLD SHIMMER ---------- */

.hero-name{
    background-size:250% 100%;

    animation:
        heroReveal .9s .12s both,
        v30GoldShimmer 5s ease-in-out 1s infinite;
}

@keyframes v30GoldShimmer{

    0%{
        background-position:100% 50%;
    }

    50%{
        background-position:0% 50%;
    }

    100%{
        background-position:100% 50%;
    }

}

/* ---------- PHOTO CINEMATIC FRAME ---------- */

.photo-frame{
    transform-style:preserve-3d;

    will-change:
        transform;

    transition:
        transform .25s ease-out;
}

.photo-frame::before{
    animation:
        v30FramePulse 4s ease-in-out infinite;
}

.photo-frame::after{
    animation:
        v30FrameRotate 12s linear infinite;
}

@keyframes v30FramePulse{

    0%,100%{
        box-shadow:
            0 0 25px
            rgba(212,175,55,.05);
    }

    50%{
        box-shadow:
            0 0 65px
            rgba(212,175,55,.18);
    }

}

@keyframes v30FrameRotate{

    0%{
        transform:rotate(1deg);
    }

    50%{
        transform:rotate(-1deg);
    }

    100%{
        transform:rotate(1deg);
    }

}

/* ---------- GOLD LIGHT SWEEP ---------- */

.photo-frame::after{
    background:
        linear-gradient(
            115deg,
            transparent 25%,
            rgba(255,240,160,.18),
            transparent 75%
        ),
        transparent;

    background-size:
        220% 220%,
        auto;

    animation:
        v30Sweep 6s ease-in-out infinite;
}

@keyframes v30Sweep{

    0%,55%,100%{
        background-position:
            -180% -180%,
            0 0;
    }

    75%{
        background-position:
            180% 180%,
            0 0;
    }

}

/* ---------- FLOATING PARTICLES ---------- */

#v30Particles{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;

    opacity:.7;
}

/* ---------- CONTENT ABOVE PARTICLES ---------- */

header,
main,
footer{
    position:relative;
    z-index:2;
}

/* ---------- PREMIUM CARDS ---------- */

.about-card,
.value-card,
.gallery-item,
.contact-card,
.fact{
    transform-style:preserve-3d;

    will-change:
        transform,
        box-shadow;

    transition:
        transform .5s
        cubic-bezier(.22,1,.36,1),
        border-color .4s ease,
        box-shadow .4s ease;
}

.about-card:hover,
.fact:hover{
    transform:
        translateY(-7px)
        scale(1.01);

    border-color:
        rgba(212,175,55,.38);

    box-shadow:
        0 30px 80px
        rgba(212,175,55,.08);
}

/* ---------- VALUE CARDS ---------- */

.value-card:hover{

    transform:
        translateY(-12px)
        rotateX(2deg);

    box-shadow:
        0 30px 80px
        rgba(212,175,55,.11);
}

.value-icon{

    animation:
        v30IconFloat
        4s
        ease-in-out
        infinite;
}

.value-card:nth-child(2)
.value-icon{
    animation-delay:.8s;
}

.value-card:nth-child(3)
.value-icon{
    animation-delay:1.6s;
}

@keyframes v30IconFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:
            translateY(-6px)
            rotate(4deg);
    }

}

/* ---------- GALLERY ---------- */

.gallery-item{
    transform:
        translateZ(0);

    transition:
        transform .65s
        cubic-bezier(.22,1,.36,1),
        box-shadow .5s ease,
        border-color .4s ease;
}

.gallery-item:hover{

    transform:
        translateY(-10px)
        scale(1.015);

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.5),
        0 0 35px
        rgba(212,175,55,.08);

    border-color:
        rgba(212,175,55,.5);
}

.gallery-item img{

    will-change:
        transform;

    transition:
        transform 1.2s
        cubic-bezier(.22,1,.36,1),
        filter .6s ease;
}

.gallery-item:hover img{

    transform:
        scale(1.13);

    filter:
        saturate(1.1)
        contrast(1.04);
}

/* ---------- GALLERY SHINE ---------- */

.gallery-item{
    overflow:hidden;
}

.gallery-item::before{

    content:"";

    position:absolute;

    top:-120%;
    left:-70%;

    width:45%;
    height:350%;

    z-index:4;

    transform:
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,240,160,.22),
            transparent
        );

    opacity:0;

    transition:
        opacity .3s ease;
}

.gallery-item:hover::before{

    opacity:1;

    animation:
        v30GalleryShine
        1.2s
        ease;
}

@keyframes v30GalleryShine{

    from{
        left:-70%;
    }

    to{
        left:140%;
    }

}

/* ---------- TIMELINE ---------- */

.timeline-dot{

    animation:
        v30DotPulse
        2.5s
        ease-in-out
        infinite;
}

.timeline-item:nth-child(2)
.timeline-dot{
    animation-delay:.4s;
}

.timeline-item:nth-child(3)
.timeline-dot{
    animation-delay:.8s;
}

.timeline-item:nth-child(4)
.timeline-dot{
    animation-delay:1.2s;
}

.timeline-item:nth-child(5)
.timeline-dot{
    animation-delay:1.6s;
}

@keyframes v30DotPulse{

    0%,100%{
        box-shadow:
            0 0 12px
            rgba(212,175,55,.35);
    }

    50%{
        box-shadow:
            0 0 30px
            rgba(212,175,55,.85);
    }

}

/* ---------- SOCIAL BUTTONS ---------- */

.social{

    position:relative;

    overflow:hidden;
}

.social::before{

    content:"";

    position:absolute;

    width:0;
    height:0;

    left:50%;
    top:50%;

    border-radius:50%;

    background:
        rgba(212,175,55,.14);

    transform:
        translate(-50%,-50%);

    transition:
        width .5s ease,
        height .5s ease;
}

.social:hover::before{

    width:130px;
    height:130px;
}

.social svg{

    position:relative;

    z-index:2;

    transition:
        transform .4s
        cubic-bezier(.22,1,.36,1);
}

.social:hover svg{

    transform:
        scale(1.15)
        rotate(5deg);
}

/* ---------- BUTTON SHINE ---------- */

.action-btn{

    position:relative;

    overflow:hidden;
}

.action-btn::after{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    transform:
        skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.16),
            transparent
        );
}

.action-btn:hover::after{

    animation:
        v30ButtonShine
        .8s
        ease;
}

@keyframes v30ButtonShine{

    from{
        left:-120%;
    }

    to{
        left:150%;
    }

}

/* ---------- MENU ---------- */

.side-menu a{

    opacity:0;

    transform:
        translateX(25px);

    transition:
        opacity .5s ease,
        transform .6s
        cubic-bezier(.22,1,.36,1),
        color .3s ease;
}

.side-menu.active a{

    opacity:1;

    transform:
        translateX(0);
}

.side-menu.active a:nth-of-type(1){
    transition-delay:.08s;
}

.side-menu.active a:nth-of-type(2){
    transition-delay:.14s;
}

.side-menu.active a:nth-of-type(3){
    transition-delay:.20s;
}

.side-menu.active a:nth-of-type(4){
    transition-delay:.26s;
}

.side-menu.active a:nth-of-type(5){
    transition-delay:.32s;
}

.side-menu.active a:nth-of-type(6){
    transition-delay:.38s;
}

/* ---------- HEADER ---------- */

.logo{

    position:relative;

    transition:
        transform .35s
        ease,
        text-shadow .35s ease;
}

.logo:hover{

    transform:
        scale(1.08);

    text-shadow:
        0 0 25px
        rgba(212,175,55,.6);
}

/* ---------- SCROLL PROGRESS ---------- */

.progress-bar{

    box-shadow:
        0 0 12px
        rgba(212,175,55,.8);
}

/* ---------- BACK TO TOP ---------- */

.top-btn:hover{

    box-shadow:
        0 0 35px
        rgba(212,175,55,.25);
}

/* ---------- FOOTER MBK ---------- */

.footer-symbol{

    animation:
        v30FooterGlow
        4s
        ease-in-out
        infinite;
}

@keyframes v30FooterGlow{

    0%,100%{
        text-shadow:
            0 0 0
            rgba(212,175,55,0);
    }

    50%{
        text-shadow:
            0 0 25px
            rgba(212,175,55,.35);
    }

}

/* ---------- MOBILE ---------- */

@media(max-width:760px){

    #v30Particles{
        opacity:.42;
    }

    body::after{
        width:420px;
        height:420px;
    }

    .gallery-item:hover{
        transform:
            translateY(-5px)
            scale(1.005);
    }

}

/* ---------- REDUCED MOTION ---------- */

@media(prefers-reduced-motion:reduce){

    #v30Particles{
        display:none;
    }

    body::after,
    .hero::after,
    .value-icon,
    .timeline-dot,
    .footer-symbol{
        animation:none!important;
    }

}

</style>


<script id="MBK-V30-ENGINE">

(function(){

"use strict";

/* =========================================================
   MBK V30 — PARTICLE ENGINE
========================================================= */

const canvas =
    document.createElement("canvas");

canvas.id =
    "v30Particles";

document.body.prepend(canvas);

const ctx =
    canvas.getContext("2d");

let width =
    0;

let height =
    0;

let particles =
    [];

const reducedMotion =
    window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

function resize(){

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize,
    {passive:true}
);

if(!reducedMotion){

    const count =
        Math.min(
            90,
            Math.max(
                35,
                Math.floor(
                    window.innerWidth / 15
                )
            )
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        particles.push({

            x:
                Math.random()
                * window.innerWidth,

            y:
                Math.random()
                * window.innerHeight,

            r:
                Math.random()
                * 1.7
                + .35,

            vx:
                (Math.random()-.5)
                * .18,

            vy:
                Math.random()
                * -.25
                - .04,

            alpha:
                Math.random()
                * .55
                + .12,

            phase:
                Math.random()
                * Math.PI
                * 2

        });

    }

}

function draw(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    if(!reducedMotion){

        const time =
            performance.now()
            * .001;

        particles.forEach(
            function(p){

                p.x += p.vx;

                p.y += p.vy;

                p.phase += .01;

                if(p.y < -10){

                    p.y =
                        height + 10;

                    p.x =
                        Math.random()
                        * width;

                }

                if(p.x < -10)
                    p.x = width + 10;

                if(p.x > width + 10)
                    p.x = -10;

                const glow =
                    p.alpha *
                    (
                        .65 +
                        Math.sin(
                            time * 1.4
                            + p.phase
                        ) * .35
                    );

                const gradient =
                    ctx.createRadialGradient(
                        p.x,
                        p.y,
                        0,
                        p.x,
                        p.y,
                        p.r * 6
                    );

                gradient.addColorStop(
                    0,
                    "rgba(255,240,160," +
                    glow +
                    ")"
                );

                gradient.addColorStop(
                    1,
                    "rgba(212,175,55,0)"
                );

                ctx.fillStyle =
                    gradient;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.r * 6,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }
        );

    }

    requestAnimationFrame(
        draw
    );

}

draw();


/* =========================================================
   MBK V30 — 3D CARD TILT
========================================================= */

if(
    window.matchMedia(
        "(pointer:fine)"
    ).matches &&
    !reducedMotion
){

    const cards =
        document.querySelectorAll(
            ".value-card, .about-card, .fact, .contact-card"
        );

    cards.forEach(
        function(card){

            card.addEventListener(
                "mousemove",
                function(event){

                    const rect =
                        card.getBoundingClientRect();

                    const x =
                        event.clientX -
                        rect.left;

                    const y =
                        event.clientY -
                        rect.top;

                    const rotateY =
                        (
                            x /
                            rect.width
                            -.5
                        ) * 5;

                    const rotateX =
                        (
                            .5 -
                            y /
                            rect.height
                        ) * 5;

                    card.style.transform =
                        "perspective(900px) " +
                        "rotateX(" +
                        rotateX +
                        "deg) " +
                        "rotateY(" +
                        rotateY +
                        "deg) " +
                        "translateY(-5px)";

                },
                {passive:true}
            );

            card.addEventListener(
                "mouseleave",
                function(){

                    card.style.transform =
                        "";

                }
            );

        }
    );


    /* =====================================================
       HERO PHOTO TILT
    ===================================================== */

    const photo =
        document.querySelector(
            ".photo-frame"
        );

    if(photo){

        photo.addEventListener(
            "mousemove",
            function(event){

                const rect =
                    photo.getBoundingClientRect();

                const x =
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width -
                    .5;

                const y =
                    (
                        event.clientY -
                        rect.top
                    ) /
                    rect.height -
                    .5;

                photo.style.transform =
                    "perspective(1100px) " +
                    "rotateY(" +
                    x * 8 +
                    "deg) " +
                    "rotateX(" +
                    y * -8 +
                    "deg) " +
                    "translateZ(8px)";

            },
            {passive:true}
        );

        photo.addEventListener(
            "mouseleave",
            function(){

                photo.style.transform =
                    "";

            }
        );

    }

}


/* =========================================================
   V30 MAGNETIC BUTTONS
========================================================= */

if(
    window.matchMedia(
        "(pointer:fine)"
    ).matches &&
    !reducedMotion
){

    document
        .querySelectorAll(
            ".action-btn, .social, .menu-btn, .top-btn"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "mousemove",
                    function(event){

                        const rect =
                            button.getBoundingClientRect();

                        const x =
                            event.clientX -
                            (
                                rect.left +
                                rect.width / 2
                            );

                        const y =
                            event.clientY -
                            (
                                rect.top +
                                rect.height / 2
                            );

                        button.style.transform =
                            "translate(" +
                            x * .12 +
                            "px," +
                            y * .12 +
                            "px)";

                    },
                    {passive:true}
                );

                button.addEventListener(
                    "mouseleave",
                    function(){

                        button.style.transform =
                            "";

                    }
                );

            }
        );

}


/* =========================================================
   V30 SCROLL PARALLAX
========================================================= */

if(!reducedMotion){

    let ticking =
        false;

    function parallax(){

        const scroll =
            window.scrollY;

        const heroGrid =
            document.querySelector(
                ".hero-grid"
            );

        if(heroGrid){

            heroGrid.style.transform =
                "translateY(" +
                scroll * .12 +
                "px)";

        }

        const corners =
            document.querySelectorAll(
                ".hero-corner"
            );

        corners.forEach(
            function(corner,index){

                corner.style.transform =
                    "translateY(" +
                    scroll *
                    (
                        index
                        ? -.04
                        : .04
                    ) +
                    "px)";

            }
        );

        ticking =
            false;

    }

    window.addEventListener(
        "scroll",
        function(){

            if(!ticking){

                requestAnimationFrame(
                    parallax
                );

                ticking =
                    true;

            }

        },
        {passive:true}
    );

}


/* =========================================================
   V30 TIMELINE STAGGER
========================================================= */

const timelineItems =
    document.querySelectorAll(
        ".timeline-item"
    );

timelineItems.forEach(
    function(item,index){

        item.style.transitionDelay =
            (
                index * .12
            ) +
            "s";

    }
);


/* =========================================================
   V30 CURSOR RING
========================================================= */

if(
    window.matchMedia(
        "(pointer:fine)"
    ).matches &&
    !reducedMotion
){

    const ring =
        document.createElement(
            "div"
        );

    ring.id =
        "v30CursorRing";

    Object.assign(
        ring.style,
        {
            position:"fixed",
            width:"24px",
            height:"24px",
            border:"1px solid rgba(212,175,55,.5)",
            borderRadius:"50%",
            pointerEvents:"none",
            zIndex:"999999",
            transform:"translate(-50%,-50%)",
            transition:
                "width .25s ease," +
                "height .25s ease," +
                "border-color .25s ease," +
                "opacity .25s ease",
            opacity:"0"
        }
    );

    document.body.appendChild(
        ring
    );

    let x =
        window.innerWidth / 2;

    let y =
        window.innerHeight / 2;

    let tx =
        x;

    let ty =
        y;

    window.addEventListener(
        "mousemove",
        function(event){

            tx =
                event.clientX;

            ty =
                event.clientY;

            ring.style.opacity =
                "1";

        },
        {passive:true}
    );

    function animateCursor(){

        x +=
            (tx-x) * .18;

        y +=
            (ty-y) * .18;

        ring.style.left =
            x + "px";

        ring.style.top =
            y + "px";

        requestAnimationFrame(
            animateCursor
        );

    }

    animateCursor();

    document
        .querySelectorAll(
            "a,button,.gallery-item"
        )
        .forEach(
            function(element){

                element.addEventListener(
                    "mouseenter",
                    function(){

                        ring.style.width =
                            "46px";

                        ring.style.height =
                            "46px";

                        ring.style.borderColor =
                            "rgba(255,240,160,.9)";

                    }
                );

                element.addEventListener(
                    "mouseleave",
                    function(){

                        ring.style.width =
                            "24px";

                        ring.style.height =
                            "24px";

                        ring.style.borderColor =
                            "rgba(212,175,55,.5)";

                    }
                );

            }
        );

}


/* =========================================================
   V30 SECTION REVEAL ENHANCEMENT
========================================================= */

const v30Reveal =
    document.querySelectorAll(
        ".section.reveal"
    );

v30Reveal.forEach(
    function(section,index){

        section.style.transitionDelay =
            (
                Math.min(index * .05,.25)
            ) +
            "s";

    }
);

})();

                    </script>
