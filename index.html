<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مبخوت بن عبدالله</title>

<meta name="description" content="الموقع الشخصي لمبخوت بن عبدالله">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --navy:#061426;
    --navy2:#091b30;
    --gold:#d4af37;
    --gold-light:#f2d76b;
    --white:#f8f7f2;
    --muted:#b9bec5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(212,175,55,.09),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            #020914,
            var(--navy) 50%,
            #030b16
        );

    color:var(--white);

    font-family:"Cairo",sans-serif;

    overflow-x:hidden;
}

body::before{
    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.18;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:70px 70px;
}

.gold-glow{
    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        rgba(212,175,55,.08);

    filter:blur(90px);

    top:25%;
    left:50%;

    transform:
        translateX(-50%);

    pointer-events:none;
}


/* HEADER */

header{
    height:82px;

    padding:0 7%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(2,9,20,.88);

    border-bottom:
        1px solid
        rgba(212,175,55,.15);

    backdrop-filter:blur(18px);

    position:relative;

    z-index:10;
}

.brand{
    direction:ltr;

    font-family:Arial,sans-serif;

    font-size:25px;

    font-weight:700;

    letter-spacing:8px;

    color:var(--gold-light);
}

.header-title{
    font-size:15px;

    color:#c4c8ce;

    font-weight:500;
}


/* MAIN */

main{
    width:min(1050px,92%);

    margin:auto;
}

.hero{
    min-height:
        calc(100vh - 82px);

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        70px 0 90px;

    text-align:center;

    position:relative;
}


/* CORNERS */

.corner{
    position:absolute;

    width:72px;
    height:72px;

    border-color:
        rgba(212,175,55,.8);
}

.corner.one{
    top:42px;
    right:0;

    border-top:2px solid;
    border-right:2px solid;
}

.corner.two{
    bottom:45px;
    left:0;

    border-bottom:2px solid;
    border-left:2px solid;
}


/* NAME */

.name{
    font-family:"Cairo",sans-serif;

    font-size:
        clamp(42px,8vw,82px);

    font-weight:800;

    line-height:1.25;

    letter-spacing:-2px;

    color:var(--white);

    margin-top:18px;

    margin-bottom:22px;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.35);

    animation:
        reveal .9s ease both;
}

.name span{
    color:var(--gold-light);
}


/* GOLD LINE */

.gold-line{
    width:150px;

    height:2px;

    margin-bottom:48px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            var(--gold-light),
            var(--gold),
            transparent
        );

    box-shadow:
        0 0 20px
        rgba(212,175,55,.45);

    animation:
        reveal .9s .15s ease both;
}


/* PHOTO */

.photo-frame{
    width:min(470px,88vw);

    aspect-ratio:4 / 5;

    position:relative;

    padding:11px;

    margin-bottom:42px;

    animation:
        reveal .9s .25s ease both;
}

.photo-frame::before{
    content:"";

    position:absolute;

    inset:0;

    border:
        1px solid
        rgba(212,175,55,.9);

    border-radius:
        32px
        32px
        75px
        75px;

    transform:
        rotate(-1.2deg);

    box-shadow:
        0 0 45px
        rgba(212,175,55,.09);
}

.photo-frame::after{
    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(212,175,55,.28);

    border-radius:
        27px
        27px
        68px
        68px;

    transform:
        rotate(1.2deg);
}

.profile-photo{
    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    position:relative;

    z-index:2;

    border-radius:
        24px
        24px
        62px
        62px;

    border:
        5px solid
        #07172a;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.5);

    transition:
        transform .5s ease,
        box-shadow .5s ease;
}

.photo-frame:hover
.profile-photo{
    transform:
        scale(1.015);

    box-shadow:
        0 30px 85px
        rgba(0,0,0,.6);
}


/* QUOTE */

.quote{
    font-size:
        clamp(22px,4vw,30px);

    font-weight:500;

    color:var(--white);

    margin-bottom:28px;

    animation:
        reveal .9s .35s ease both;
}


/* LINKS */

.links{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:14px;

    flex-wrap:wrap;

    animation:
        reveal .9s .45s ease both;
}

.link{
    min-width:200px;

    padding:
        14px 25px;

    border-radius:999px;

    border:
        1px solid
        rgba(212,175,55,.42);

    background:
        rgba(255,255,255,.025);

    color:var(--white);

    text-decoration:none;

    font-size:16px;

    font-weight:600;

    transition:.3s ease;
}

.link:hover{
    transform:
        translateY(-4px);

    border-color:
        var(--gold-light);

    background:
        rgba(212,175,55,.08);

    box-shadow:
        0 12px 35px
        rgba(212,175,55,.13);
}

.link span{
    color:
        var(--gold-light);

    margin-left:8px;
}


/* FOOTER */

footer{
    padding:
        32px 20px;

    text-align:center;

    border-top:
        1px solid
        rgba(212,175,55,.14);

    background:
        rgba(2,8,17,.7);
}

.footer-name{
    font-size:14px;

    color:#8f969f;
}

.footer-mbk{
    direction:ltr;

    margin-top:8px;

    color:var(--gold);

    font-family:Arial,sans-serif;

    font-weight:700;

    letter-spacing:5px;
}


/* ANIMATION */

@keyframes reveal{

    from{
        opacity:0;

        transform:
            translateY(20px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }
}


/* MOBILE */

@media(max-width:600px){

    header{
        height:72px;

        padding:
            0 22px;
    }

    .brand{
        font-size:21px;

        letter-spacing:6px;
    }

    .header-title{
        font-size:13px;
    }

    .hero{
        padding:
            48px 0 70px;
    }

    .name{
        font-size:
            clamp(40px,11vw,58px);

        letter-spacing:
            -1.5px;

        line-height:
            1.35;

        margin-bottom:
            20px;
    }

    .gold-line{
        width:110px;

        margin-bottom:
            38px;
    }

    .photo-frame{
        width:
            min(390px,88vw);

        margin-bottom:
            35px;
    }

    .quote{
        font-size:21px;

        margin-bottom:
            25px;
    }

    .links{
        width:100%;

        flex-direction:
            column;
    }

    .link{
        width:
            min(330px,100%);
    }

    .corner{
        width:48px;
        height:48px;
    }

    .corner.one{
        top:15px;
    }

    .corner.two{
        bottom:20px;
    }

    footer{
        padding:
            28px 15px;
    }

    .footer-name{
        font-size:12px;
    }
}


/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;

        transition:none !important;
    }
}

</style>
</head>


<body>

<div class="gold-glow"></div>


<header>

    <div class="brand">
        MBK
    </div>

    <div class="header-title">
        الموقع الشخصي
    </div>

</header>


<main>

<section class="hero">


    <div class="corner one"></div>

    <div class="corner two"></div>


    <h1 class="name">
        مبخوت <span>بن عبدالله</span>
    </h1>


    <div class="gold-line"></div>


    <!-- الصورة الجديدة -->

    <div class="photo-frame">

        <img
            class="profile-photo"
            src="file_00000000202482468d4027eb8c5919f7.png"
            alt="مبخوت بن عبدالله"
            loading="eager"
        >

    </div>


    <p class="quote">
        وما توفيقي إلا بالله
    </p>


    <div class="links">

        <a
            class="link"
            href="mailto:Mabkhut505g@gmail.com"
        >
            <span>✉</span>
            البريد الإلكتروني
        </a>


        <a
            class="link"
            href="https://www.facebook.com/share/19JG7PQiHL/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span>f</span>
            Facebook
        </a>

    </div>

</section>

</main>


<footer>

    <div class="footer-name">
        © 2026 مبخوت بن عبدالله — جميع الحقوق محفوظة
    </div>

    <div class="footer-mbk">
        MBK
    </div>

</footer>


</body>
</html>
