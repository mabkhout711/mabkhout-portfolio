<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#020307">

    <meta
        name="description"
        content="Mabkhout — مرحبًا بك في تجربتي الرقمية."
    >

    <title>MABKHOUT — مرحبًا بك</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #020307;
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button {
            font-family: inherit;
        }

        /* =========================================================
           LOADER
        ========================================================= */

        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(214, 166, 47, 0.08),
                    transparent 30%
                ),
                #020307;

            transition:
                opacity 0.9s ease,
                visibility 0.9s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =========================================================
           BACKGROUND GRID
        ========================================================= */

        .loader-grid {
            position: absolute;
            inset: 0;

            opacity: 0.35;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size:
                70px 70px;

            transform:
                perspective(500px)
                rotateX(55deg)
                scale(1.6)
                translateY(25%);

            transform-origin: center bottom;

            mask-image:
                linear-gradient(
                    to top,
                    rgba(0,0,0,1),
                    transparent 75%
                );

            -webkit-mask-image:
                linear-gradient(
                    to top,
                    rgba(0,0,0,1),
                    transparent 75%
                );
        }

        /* =========================================================
           CENTER
        ========================================================= */

        .loader-content {
            position: relative;
            z-index: 2;

            width: min(90%, 520px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        /* =========================================================
           LOGO
        ========================================================= */

        .logo {
            position: relative;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(92px, 24vw, 150px);
            line-height: 0.8;

            letter-spacing: -12px;

            color: #dcae32;

            text-shadow:
                0 0 15px rgba(220, 174, 50, 0.15),
                0 0 45px rgba(220, 174, 50, 0.08);

            user-select: none;

            animation:
                logoReveal 1.2s ease both;
        }

        @keyframes logoReveal {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .brand-name {
            margin-top: 42px;

            font-size: 15px;
            letter-spacing: 11px;

            color: rgba(210, 218, 235, 0.65);

            direction: ltr;

            animation:
                brandReveal 1s ease 0.3s both;
        }

        @keyframes brandReveal {
            from {
                opacity: 0;
                letter-spacing: 3px;
            }

            to {
                opacity: 1;
                letter-spacing: 11px;
            }
        }

        /* =========================================================
           LINE
        ========================================================= */

        .loading-line {
            position: relative;

            width: 100%;
            height: 2px;

            margin-top: 68px;

            background:
                rgba(255,255,255,0.12);

            overflow: hidden;
        }

        .loading-progress {
            position: absolute;

            right: auto;
            left: 0;
            top: 0;

            width: 0%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #9c7620,
                    #f1c64e,
                    #fff0a1
                );

            box-shadow:
                0 0 12px rgba(241,198,78,0.5);

            transition:
                width 0.15s linear;
        }

        /* =========================================================
           PERCENT
        ========================================================= */

        .percent {
            margin-top: 32px;

            min-width: 80px;

            color: #e4bc45;

            font-size: 28px;
            font-weight: 300;

            letter-spacing: 2px;

            direction: ltr;

            font-variant-numeric: tabular-nums;
        }

        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {
            margin-top: 38px;

            font-size: 18px;
            font-weight: 400;

            color: rgba(255,255,255,0.82);

            letter-spacing: 2px;

            opacity: 0;

            transform: translateY(8px);

            transition:
                opacity 0.6s ease,
                transform 0.6s ease;
        }

        .welcome.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
           ENTER BUTTON
        ========================================================= */

        .enter-button {
            margin-top: 28px;

            padding: 13px 30px;

            border: 1px solid rgba(220,174,50,0.5);

            border-radius: 999px;

            background:
                rgba(220,174,50,0.06);

            color: #e7c65f;

            font-size: 14px;

            cursor: pointer;

            opacity: 0;
            pointer-events: none;

            transform: translateY(10px);

            transition:
                all 0.3s ease;
        }

        .enter-button.show {
            opacity: 1;
            pointer-events: auto;

            transform: translateY(0);
        }

        .enter-button:hover {
            background: rgba(220,174,50,0.13);

            border-color:
                rgba(220,174,50,0.9);

            box-shadow:
                0 0 25px rgba(220,174,50,0.1);
        }

        .enter-button:active {
            transform: scale(0.96);
        }

        /* =========================================================
           MAIN WEBSITE
        ========================================================= */

        #site {
            position: fixed;
            inset: 0;

            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(214,166,47,0.07),
                    transparent 32%
                ),
                #020307;

            opacity: 0;
            visibility: hidden;

            transform: scale(1.03);

            transition:
                opacity 1s ease,
                visibility 1s ease,
                transform 1s ease;
        }

        #site.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .site-content {
            max-width: 900px;

            text-align: center;
        }

        .site-logo {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(70px, 18vw, 140px);

            color: #dcae32;

            line-height: 0.8;

            letter-spacing: -8px;

            text-shadow:
                0 0 35px rgba(220,174,50,0.1);
        }

        .site-title {
            margin-top: 42px;

            font-size: clamp(30px, 7vw, 60px);

            font-weight: 500;

            color: #ffffff;
        }

        .site-description {
            margin-top: 18px;

            color:
                rgba(220,226,238,0.65);

            font-size: 16px;

            line-height: 1.8;
        }

        .site-line {
            width: 80px;
            height: 1px;

            margin: 32px auto;

            background: #dcae32;

            box-shadow:
                0 0 15px rgba(220,174,50,0.35);
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .loader-content {
                width: 82%;
            }

            .logo {
                font-size: 100px;
            }

            .brand-name {
                margin-top: 34px;

                font-size: 12px;

                letter-spacing: 8px;
            }

            .loading-line {
                margin-top: 60px;
            }

            .percent {
                margin-top: 26px;

                font-size: 25px;
            }

            .welcome {
                margin-top: 30px;

                font-size: 17px;
            }

            .enter-button {
                margin-top: 24px;
            }
        }

        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         LOADING SCREEN
    ========================================================= -->

    <section id="loader">

        <div class="loader-grid"></div>

        <div class="loader-content">

            <div class="logo">
                MB
            </div>

            <div class="brand-name">
                MABKHOUT
            </div>

            <div class="loading-line">
                <div
                    id="progress"
                    class="loading-progress">
                </div>
            </div>

            <div
                id="percent"
                class="percent">
                0%
            </div>

            <div
                id="welcome"
                class="welcome">
                مرحبًا بك
            </div>

            <button
                id="enterButton"
                class="enter-button"
                type="button">
                دخول الموقع
            </button>

        </div>
    </section>


    <!-- =========================================================
         MAIN WEBSITE
    ========================================================= -->

    <main id="site">

        <div class="site-content">

            <div class="site-logo">
                MB
            </div>

            <h1 class="site-title">
                مرحبًا بك
            </h1>

            <div class="site-line"></div>

            <p class="site-description">
                أهلاً بك في عالم مبخوت.
                <br>
                تجربة رقمية صُممت بأسلوب مختلف.
            </p>

        </div>

    </main>


    <script>

        /* =========================================================
           MABKHOUT LOADER
        ========================================================= */

        (() => {

            "use strict";


            const loader =
                document.getElementById("loader");

            const site =
                document.getElementById("site");

            const progress =
                document.getElementById("progress");

            const percent =
                document.getElementById("percent");

            const welcome =
                document.getElementById("welcome");

            const enterButton =
                document.getElementById("enterButton");


            let currentProgress = 0;

            let finished = false;


            /* =====================================================
               تحديث النسبة
            ===================================================== */

            function updateProgress(value) {

                currentProgress =
                    Math.max(
                        0,
                        Math.min(100, value)
                    );

                progress.style.width =
                    currentProgress + "%";

                percent.textContent =
                    Math.round(currentProgress) + "%";
            }


            /* =====================================================
               دخول الموقع
            ===================================================== */

            function enterSite() {

                if (finished) {
                    return;
                }

                finished = true;

                updateProgress(100);

                welcome.classList.add("show");

                enterButton.classList.add("show");

                /*
                 * ننتظر قليلًا حتى تظهر 100%
                 * ثم نفتح الموقع.
                 */

                setTimeout(() => {

                    loader.classList.add("hidden");

                    site.classList.add("visible");

                    /*
                     * السماح بالتمرير بعد فتح الموقع
                     */

                    document.body.style.overflow =
                        "auto";

                }, 650);
            }


            /* =====================================================
               التحميل الآمن
               
               مهم:
               هذا الجزء هو الذي يمنع مشكلة 0%.
               حتى لو فشل شيء في الصفحة، سيتم الدخول.
            ===================================================== */

            function startLoader() {

                /*
                 * نستخدم مدة ثابتة بدل انتظار صور
                 * أو مكتبات خارجية قد تتسبب في التعليق.
                 */

                const duration = 2200;

                const startTime =
                    performance.now();


                function animate(now) {

                    const elapsed =
                        now - startTime;

                    let value =
                        (elapsed / duration) * 100;


                    /*
                     * نبطئ قليلًا قرب النهاية
                     * حتى يبدو التحميل طبيعيًا.
                     */

                    if (value < 85) {

                        value *= 1;

                    } else {

                        value =
                            85 +
                            (value - 85) * 0.75;
                    }


                    updateProgress(value);


                    if (elapsed < duration) {

                        requestAnimationFrame(animate);

                    } else {

                        enterSite();
                    }
                }


                requestAnimationFrame(animate);
            }


            /* =====================================================
               زر الدخول اليدوي
            ===================================================== */

            enterButton.addEventListener(
                "click",
                enterSite
            );


            /* =====================================================
               حماية إضافية
               
               إذا حدث أي خطأ أو تأخر غير متوقع،
               لا نترك المستخدم عالقًا.
            ===================================================== */

            setTimeout(() => {

                if (!finished) {
                    enterSite();
                }

            }, 5000);


            /* =====================================================
               بدء التشغيل
            ===================================================== */

            startLoader();


        })();

    </script>

</body>
</html>
