<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mabkhout Bin Abdullah</title>

<meta name="description" content="الموقع الشخصي لمبخوت بن عبدالله">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --navy:#030b18;
    --navy2:#07182d;
    --gold:#d4af37;
    --gold2:#f3dc7b;
    --white:#ffffff;
    --muted:#aeb8c7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    font-family:"Cairo",sans-serif;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(212,175,55,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(18,55,92,.35),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #020711,
            #061326 55%,
            #020812
        );
}

/* شبكة خلفية */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:80px 80px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}

/* توهج ذهبي */

body::after{
    content:"";
    position:fixed;

    width:500px;
    height:500px;

    top:40%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(212,175,55,.06);

    filter:blur(100px);

    pointer-events:none;
}

/* NAVBAR */

nav{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:78px;

    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:1000;

    background:rgba(2,8,18,.72);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:
        1px solid rgba(212,175,55,.12);
}

.logo{
    font-family:"Inter",sans-serif;

    font-size:22px;
    font-weight:800;

    letter-spacing:7px;

    color:var(--gold2);
}

.nav-text{
    font-size:12px;

    color:#aeb8c7;

    transition:.3s;
}

.nav-text:hover{
    color:var(--gold2);
}

/* HERO */

main{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        120px 20px 70px;
}

.hero{
    width:min(1100px,100%);

    text-align:center;

    animation:
        entrance 1.2s ease forwards;
}

@keyframes entrance{

    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* الاسم */

.name{
    direction:ltr;

    font-family:"Inter",sans-serif;

    font-size:
        clamp(38px,7vw,76px);

    line-height:1.1;

    font-weight:700;

    letter-spacing:-2px;

    color:white;

    margin-bottom:35px;

    text-shadow:
        0 15px 45px rgba(0,0,0,.5);
}

.name span{
    color:var(--gold2);
}

/* الصورة */

.photo-container{

    position:relative;

    width:350px;
    height:440px;

    margin:0 auto 38px;

    perspective:1000px;
}

/* الهالة */

.photo-glow{

    position:absolute;

    width:300px;
    height:300px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(212,175,55,.16);

    filter:blur(70px);

    z-index:0;
}

/* الإطار الخارجي */

.photo-frame{

    position:absolute;

    inset:0;

    border:
        1px solid
        rgba(212,175,55,.7);

    border-radius:
        180px 180px 28px 28px;

    transform:
        rotate(2.5deg);

    transition:
        transform .6s ease;

    z-index:1;
}

.photo-container:hover
.photo-frame{

    transform:
        rotate(0deg)
        scale(1.025);
}

/* إطار ثاني */

.photo-frame::before{

    content:"";

    position:absolute;

    inset:9px;

    border:
        1px solid
        rgba(212,175,55,.25);

    border-radius:
        170px 170px 20px 20px;
}

/* الصورة نفسها */

.profile-photo{

    position:absolute;

    inset:15px;

    width:
        calc(100% - 30px);

    height:
        calc(100% - 30px);

    object-fit:cover;

    border-radius:
        165px 165px 20px 20px;

    border:
        6px solid var(--navy);

    background:
        linear-gradient(
            145deg,
            #122945,
            #061326
        );

    z-index:2;

    display:block;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45);
}

/* زخارف */

.corner{
    position:absolute;

    width:45px;
    height:45px;

    border-color:var(--gold);

    z-index:4;
}

.corner.tl{
    top:-15px;
    left:-15px;

    border-top:2px solid;
    border-left:2px solid;
}

.corner.br{
    bottom:-15px;
    right:-15px;

    border-bottom:2px solid;
    border-right:2px solid;
}

/* العبارة */

.motto{

    font-size:
        clamp(22px,3vw,30px);

    font-weight:500;

    color:white;

    margin-bottom:10px;
}

.subtitle{

    color:var(--muted);

    font-size:15px;

    line-height:2;

    max-width:600px;

    margin:auto;
}

/* الخط الذهبي */

.divider{

    width:120px;
    height:1px;

    margin:25px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );

    position:relative;
}

.divider::after{

    content:"";

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--gold);

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 15px var(--gold);
}

/* الأزرار */

.actions{

    display:flex;

    justify-content:center;

    gap:14px;

    margin-top:30px;

    flex-wrap:wrap;
}

.btn{

    min-width:190px;

    padding:
        14px 25px;

    border-radius:12px;

    text-decoration:none;

    font-size:13px;

    font-weight:700;

    transition:
        transform .3s,
        box-shadow .3s;
}

.btn-gold{

    color:#071426;

    background:
        linear-gradient(
            135deg,
            #a77e19,
            #f2d66f,
            #bd9327
        );

    box-shadow:
        0 12px 35px
        rgba(212,175,55,.15);
}

.btn-outline{

    color:white;

    border:
        1px solid
        rgba(212,175,55,.5);

    background:
        rgba(255,255,255,.025);
}

.btn:hover{

    transform:
        translateY(-5px);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.3);
}

/* معلومات */

.bottom-info{

    margin-top:55px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:25px;

    color:
        rgba(255,255,255,.28);

    font-family:"Inter",sans-serif;

    font-size:9px;

    letter-spacing:3px;
}

.dot{

    width:4px;
    height:4px;

    border-radius:50%;

    background:var(--gold);

    box-shadow:
        0 0 10px var(--gold);
}

/* الجوال */

@media(max-width:600px){

    nav{
        height:65px;
        padding:0 20px;
    }

    .logo{
        font-size:18px;
        letter-spacing:5px;
    }

    .nav-text{
        font-size:10px;
    }

    main{
        padding:
            105px 18px 55px;
    }

    .name{
        font-size:39px;

        letter-spacing:-1.5px;

        margin-bottom:28px;
    }

    .photo-container{

        width:270px;
        height:350px;

        margin-bottom:32px;
    }

    .motto{
        font-size:20px;
    }

    .subtitle{
        font-size:13px;
    }

    .actions{

        flex-direction:column;

        align-items:center;

        width:100%;
    }

    .btn{

        width:min(320px,100%);
    }

    .bottom-info{

        gap:12px;

        font-size:7px;

        letter-spacing:2px;
    }

}

</style>
</head>

<body>

<nav>

    <div class="logo">
        MBK
    </div>

    <div class="nav-text">
        الموقع الشخصي
    </div>

</nav>


<main>

<section class="hero">

    <!-- الاسم الإنجليزي فقط -->

    <h1 class="name">
        Mabkhout <span>Bin Abdullah</span>
    </h1>


    <!-- الصورة -->

    <div class="photo-container">

        <div class="photo-glow"></div>

        <div class="photo-frame"></div>

        <div class="corner tl"></div>
        <div class="corner br"></div>

        <img
            class="profile-photo"
            src="file_00000000582882468daa3e8113233056.png"
            alt="مبخوت بن عبدالله"
        >

    </div>


    <div class="divider"></div>


    <!-- باقي المحتوى عربي -->

    <div class="motto">
        وما توفيقي إلا بالله
    </div>

    <p class="subtitle">
        هذا موقعي الشخصي، مساحة بسيطة تعبّر عن هويتي
        وحضوري الرقمي.
    </p>


    <!-- التواصل -->

    <div class="actions">

        <a
            class="btn btn-gold"
            href="mailto:Mabkhut505g@gmail.com"
        >
            البريد الإلكتروني
        </a>

        <a
            class="btn btn-outline"
            href="YOUR_FACEBOOK_LINK"
            target="_blank"
            rel="noopener noreferrer"
        >
            صفحتي على Facebook
        </a>

    </div>


    <div class="bottom-info">

        <span>الموقع الشخصي</span>

        <span class="dot"></span>

        <span>مبخوت بن عبدالله</span>

    </div>

</section>

</main>


<script>

/* حركة ثلاثية الأبعاد خفيفة */

const hero =
document.querySelector(".hero");

document.addEventListener(
    "mousemove",
    (e) => {

        if(window.innerWidth < 800)
            return;

        const x =
            (e.clientX /
            window.innerWidth - .5) * 2;

        const y =
            (e.clientY /
            window.innerHeight - .5) * 2;

        hero.style.transform =
            `perspective(1400px)
             rotateY(${x}deg)
             rotateX(${-y}deg)`;

    }
);

document.addEventListener(
    "mouseleave",
    () => {

        hero.style.transform =
        "perspective(1400px)
         rotateY(0deg)
         rotateX(0deg)";

    }
);

</script>

</body>

</html>
