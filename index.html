<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبحوت بن عبدالله | مطور ومصمم</title>
    <style>
        /* إعدادات الألوان والخطوط الأساسية */
        :root {
            --primary-color: #3b82f6; /* أزرق عصري */
            --bg-color: #0f172a; /* خلفية داكنة */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* شريط التنقل (Navbar) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 2px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin-right: 2rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        /* القسم الرئيسي (Hero Section) */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to left, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h2 {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 2.5rem;
        }

        .cta-button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .cta-button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        /* قسم التواصل البسيط */
        .contact {
            text-align: center;
            padding: 4rem 20px;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .contact p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .contact-email {
            font-size: 1.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">MBK</a>
        <nav>
            <a href="#about">من أنا</a>
            <a href="#portfolio">الأعمال</a>
            <a href="#contact">تواصل</a>
        </nav>
    </header>

    <section class="hero">
        <h1>مبحوت بن عبدالله</h1>
        <h2>مطور ومصمم واجهات رقمية</h2>
        <a href="mailto:mabkhout@mabkhout.com" class="cta-button">لنعمل معاً</a>
    </section>

    <section id="contact" class="contact">
        <p>جاهز لتحويل فكرتك إلى منتج حقيقي؟</p>
        <a href="mailto:mabkhout@mabkhout.com" class="contact-email">mabkhout@mabkhout.com</a>
    </section>

</body>
</html>
