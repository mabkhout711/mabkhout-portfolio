<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <!-- مهم جدًا للجوال -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#02050b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>MABKHOUT — مرحباً بك</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-width: 100%;
            max-width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #02050b;
        }

        body {
            width: 100%;
            min-width: 100%;
            max-width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: hidden;
            background: #02050b;
            color: #ffffff;
            font-family:
                Arial,
                "Segoe UI",
                Tahoma,
                sans-serif;
        }

        /* =========================================================
           LOADER
        ========================================================= */

        #loader {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(215, 168, 42, 0.10) 0%,
                    rgba(215, 168, 42, 0.035) 18%,
                    transparent 43%
                ),
                #02050b;

            z-index: 99999;

            transition:
                opacity 0.9s ease,
                visibility 0.9s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =========================================================
           GRID FLOOR
        ========================================================= */

        .grid {
            position: absolute;
            left: -20%;
            right: -20%;
            bottom: -10%;
            height: 65%;

            opacity: 0.25;

            background-image:
                linear-gradient(
                    rgba(115, 129, 153, 0.14) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(115, 129, 153, 0.14) 1px,
                    transparent 1px
                );

            background-size:
                80px 80px,
                80px 80px;

            transform:
                perspective(500px)
                rotateX(63deg)
                scale(1.4);

            transform-origin: bottom center;

            pointer-events: none;
        }

        /* =========================================================
           LIGHT GLOW
        ========================================================= */

        .gold-glow {
            position: absolute;

            width: min(55vw, 420px);
            height: min(55vw, 420px);

            left: 50%;
            top: 46%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(224, 177, 40, 0.07);

            filter: blur(70px);

            pointer-events: none;
        }

        /* =========================================================
           LOADER CONTENT
        ========================================================= */

        .loader-content {
            position: relative;

            width: 100%;
            max-width: 760px;

            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding:
                max(30px, env(safe-area-inset-top))
                24px
                max(30px, env(safe-area-inset-bottom))
                24px;

            text-align: center;

            z-index: 5;
        }

        /* =========================================================
           LOGO
        ========================================================= */

        .logo {
            position: relative;

            margin-top: -30px;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: logoIn 1.2s ease both;
        }

        .logo-mark {
            direction: ltr;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(82px, 18vw, 150px);

            line-height: 0.85;

            font-weight: 700;

            letter-spacing: -10px;

            padding-right: 10px;

            color: #e3b52e;

            text-shadow:
                0 0 10px rgba(227, 181, 46, 0.16),
                0 0 35px rgba(227, 181, 46, 0.12);

            white-space: nowrap;
        }

        .brand-name {
            direction: ltr;

            margin-top: 28px;

            font-size: clamp(13px, 3.5vw, 20px);

            letter-spacing:
                clamp(7px, 2.2vw, 13px);

            color: #758096;

            font-weight: 400;

            padding-left:
                clamp(7px, 2.2vw, 13px);

            white-space: nowrap;
        }

        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {
            margin-top: 45px;

            color: #f0d477;

            font-size: clamp(25px, 6vw, 40px);

            font-weight: 500;

            letter-spacing: 0;

            text-shadow:
                0 0 18px rgba(240, 212, 119, 0.18);

            animation:
                welcomeIn 1s ease 0.35s both;
        }

        /* =========================================================
           PROGRESS AREA
        ========================================================= */

        .progress-area {
            width: min(92%, 640px);

            margin-top: 58px;

            animation:
                progressIn 1s ease 0.5s both;
        }

        .progress-line {
            position: relative;

            width: 100%;
            height: 3px;

            overflow: hidden;

            background: rgba(255, 255, 255, 0.12);
        }

        .progress-line::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(232, 193, 71, 0.95),
                    transparent
                );

            animation: shimmer 1.8s linear infinite;
        }

        .progress-fill {
            position: absolute;

            left: 0;
            top: 0;

            width: 0%;
            height: 100%;

            background: #dfb536;

            box-shadow:
                0 0 12px rgba(223, 181, 54, 0.55);

            transition: width 0.12s linear;

            z-index: 2;
        }

        .percentage {
            margin-top: 32px;

            direction: ltr;

            color: #e5c24b;

            font-size: clamp(25px, 6vw, 36px);

            font-weight: 400;

            letter-spacing: 4px;
        }

        /* =========================================================
           ANIMATIONS
        ========================================================= */

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes welcomeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progressIn {
            from {
                opacity: 0;
                transform: scaleX(0.8);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes shimmer {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(100%);
            }
        }

        /* =========================================================
           MAIN WEBSITE
        ========================================================= */

        #website {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;
            overflow-y: auto;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(215, 168, 42, 0.08),
                    transparent 35%
                ),
                #02050b;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        #website.show {
            opacity: 1;
            visibility: visible;
        }

        /* =========================================================
           MAIN HERO
        ========================================================= */

        .hero {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding:
                80px 24px
                50px;
        }

        .hero-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(100, 115, 140, 0.07) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(100, 115, 140, 0.07) 1px,
                    transparent 1px
                );

            background-size:
                70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 30%,
                    black 70%,
                    transparent
                );

            pointer-events: none;
        }

        .hero-glow {
            position: absolute;

            width: 400px;
            height: 400px;

            max-width: 80vw;
            max-height: 80vw;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(218, 173, 43, 0.08);

            filter: blur(90px);
        }

        .hero-content {
            position: relative;

            width: 100%;
            max-width: 900px;

            text-align: center;

            z-index: 2;
        }

        .hero-logo {
            direction: ltr;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(90px, 23vw, 190px);

            line-height: 0.8;

            color: #e3b52e;

            letter-spacing: -12px;

            text-shadow:
                0 0 30px rgba(227, 181, 46, 0.12);
        }

        .hero-brand {
            direction: ltr;

            margin-top: 28px;

            color: #7d8799;

            font-size: clamp(13px, 3vw, 20px);

            letter-spacing:
                clamp(8px, 2vw, 15px);

            padding-left:
                clamp(8px, 2vw, 15px);
        }

        .hero-title {
            margin-top: 45px;

            font-size: clamp(32px, 8vw, 65px);

            font-weight: 600;

            color: #ffffff;
        }

        .hero-title span {
            color: #e3b52e;
        }

        .hero-description {
            max-width: 620px;

            margin:
                25px auto
                0;

            color: #8993a5;

            font-size: clamp(15px, 4vw, 20px);

            line-height: 1.9;
        }

        .hero-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 180px;
            min-height: 52px;

            margin-top: 38px;

            padding: 12px 28px;

            border: 1px solid rgba(227, 181, 46, 0.65);

            border-radius: 3px;

            background:
                rgba(227, 181, 46, 0.05);

            color: #e3b52e;

            font-size: 16px;

            text-decoration: none;

            transition:
                background 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .hero-button:hover {
            background:
                rgba(227, 181, 46, 0.13);

            box-shadow:
                0 0 25px rgba(227, 181, 46, 0.12);

            transform: translateY(-3px);
        }

        /* =========================================================
           MOBILE FIX
        ========================================================= */

        @media (max-width: 600px) {

            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            #loader,
            #website {
                width: 100%;
                max-width: 100%;
                left: 0;
                right: 0;
            }

            .loader-content {
                width: 100%;
                padding-left: 20px;
                padding-right: 20px;
            }

            .logo {
                margin-top: -20px;
            }

            .logo-mark {
                font-size: 92px;
            }

            .brand-name {
                margin-top: 25px;
                font-size: 13px;
                letter-spacing: 8px;
                padding-left: 8px;
            }

            .welcome {
                margin-top: 40px;
                font-size: 27px;
            }

            .progress-area {
                width: calc(100% - 12px);
                margin-top: 55px;
            }

            .progress-line {
                height: 3px;
            }

            .percentage {
                margin-top: 30px;
                font-size: 28px;
            }

            .hero {
                padding-left: 20px;
                padding-right: 20px;
            }

            .hero-logo {
                font-size: 100px;
            }
        }

        /* شاشات الجوال الطويلة */
        @media (max-height: 700px) {

            .logo {
                margin-top: 0;
            }

            .logo-mark {
                font-size: 75px;
            }

            .brand-name {
                margin-top: 20px;
            }

            .welcome {
                margin-top: 28px;
            }

            .progress-area {
                margin-top: 35px;
            }
        }

        /* =========================================================
           SAFE AREA
        ========================================================= */

        @supports (padding: max(0px)) {

            #loader {
                padding-top:
                    env(safe-area-inset-top);
            }

            #website {
                padding-bottom:
                    env(safe-area-inset-bottom);
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         LOADING SCREEN
    ========================================================= -->

    <section id="loader">

        <div class="grid"></div>

        <div class="gold-glow"></div>

        <div class="loader-content">

            <div class="logo">

                <div class="logo-mark">
                    MB
                </div>

                <div class="brand-name">
                    MABKHOUT
                </div>

                <div class="welcome">
                    مرحباً بك
                </div>

            </div>

            <div class="progress-area">

                <div class="progress-line">

                    <div
                        id="progressFill"
                        class="progress-fill">
                    </div>

                </div>

                <div
                    id="percentage"
                    class="percentage">
                    0%
                </div>

            </div>

        </div>

    </section>


    <!-- =========================================================
         MAIN WEBSITE
    ========================================================= -->

    <main id="website">

        <section class="hero">

            <div class="hero-grid"></div>

            <div class="hero-glow"></div>

            <div class="hero-content">

                <div class="hero-logo">
                    MB
                </div>

                <div class="hero-brand">
                    MABKHOUT
                </div>

                <h1 class="hero-title">
                    مرحباً بك في
                    <span>MABKHOUT</span>
                </h1>

                <p class="hero-description">
                    تجربة رقمية شخصية تجمع بين الفخامة،
                    البساطة، والتصميم العصري في مكان واحد.
                </p>

                <a
                    href="#"
                    class="hero-button"
                    onclick="return false;">
                    اكتشف الموقع
                </a>

            </div>

        </section>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        (() => {

            const loader =
                document.getElementById("loader");

            const website =
                document.getElementById("website");

            const progressFill =
                document.getElementById("progressFill");

            const percentage =
                document.getElementById("percentage");

            let progress = 0;

            /*
             * تحميل تدريجي من 0 إلى 100
             * بدون انتظار موارد خارجية
             * لذلك لن تتوقف الشاشة عند 0%.
             */

            const interval =
                setInterval(() => {

                    progress += 1;

                    progressFill.style.width =
                        progress + "%";

                    percentage.textContent =
                        progress + "%";

                    if (progress >= 100) {

                        clearInterval(interval);

                        setTimeout(() => {

                            loader.classList.add("hidden");

                            website.classList.add("show");

                            document.body.style.overflowY =
                                "auto";

                        }, 500);

                    }

                }, 25);

        })();

    </script>

</body>
</html>
